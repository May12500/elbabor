name: Build iOS IPA - macOS 15 Xcode 26 iOS 26 SDK - FIX Podfile patch Python single post_install

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.38.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'

      - name: Select Xcode 26.0.1 - iOS 26.0 SDK
        run: |
          ls /Applications/ | grep -i xcode
          if [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Patch Podfile - Python - single post_install with -G fix
        run: |
          cat ios/Podfile
          python3 << 'PY'
          import re
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
          print(f"Original has {content.count('post_install')} post_install")
          content_no_post = re.sub(r'post_install do \|installer\|.*?^end\s*\n', '', content, flags=re.MULTILINE|re.DOTALL)
          fix = """
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              if respond_to?(:flutter_additional_ios_build_settings)
                flutter_additional_ios_build_settings(target)
              end
              target.build_configurations.each do |config|
                if config.build_settings['OTHER_LDFLAGS']
                  config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '')
                end
                if config.build_settings['OTHER_CFLAGS']
                  config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].to_s.gsub('-G', '')
                end
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              end
            end
          end
          """
          content = content_no_post.rstrip() + "\n\n" + fix + "\n"
          with open(path, 'w') as f:
              f.write(content)
          print("Patched Podfile:")
          print(content)
          PY
          cat ios/Podfile

      - name: Flutter clean + pub get + pod install repo-update
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build IPA iOS 26 SDK - no-codesign - 149MB
        run: |
          flutter build ipa --release --no-codesign
          ls -lh build/ios/archive/Runner.xcarchive

      - name: Upload xcarchive iOS 26 SDK - 149MB - VALID
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-xcarchive-iOS26-VALID-FINAL-149MB
          path: build/ios/archive/Runner.xcarchive
