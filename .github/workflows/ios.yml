name: Build iOS IPA - macos-15 Xcode 26.0.1 iOS 26 SDK - RADICAL NO FIRESTORE BoringSSL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.38.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'

      - name: Select Xcode 26.0.1 - iOS 26.0 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Backup pubspec and remove cloud_firestore / BoringSSL temporarily
        run: |
          cp pubspec.yaml pubspec.yaml.backup
          echo "=== BEFORE ==="
          cat pubspec.yaml | grep -E "firebase|firestore|grpc|boring"
          # Remove cloud_firestore, cloud_functions, firebase_app_check which use gRPC BoringSSL
          sed -i '' '/cloud_firestore:/d' pubspec.yaml || sed -i '/cloud_firestore:/d' pubspec.yaml
          sed -i '' '/cloud_functions:/d' pubspec.yaml || sed -i '/cloud_functions:/d' pubspec.yaml
          sed -i '' '/firebase_app_check:/d' pubspec.yaml || sed -i '/firebase_app_check:/d' pubspec.yaml
          echo "=== AFTER - No Firestore ==="
          cat pubspec.yaml | grep -E "firebase|firestore" || true
          cat pubspec.yaml

      - name: Overwrite Podfile - Single post_install - Remove -G + No BoringSSLRPC
        run: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_LDFLAGS']
                config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_CFLAGS']
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              end
            end
          end
          PODFILE
          cat ios/Podfile

      - name: Flutter clean + pub get
        run: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get

      - name: Pod deintegrate + install --repo-update - No BoringSSLRPC
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate || true
          rm -rf Pods
          pod install --repo-update --verbose
          echo "=== Check BoringSSL gone ==="
          ls Pods/Target\ Support\ Files/ | grep -i boring || echo "No BoringSSL - OK - BUG FIXED"
          cd ..

      - name: Build xcarchive iOS 26.0 SDK - CODE_SIGNING_ALLOWED=NO
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          ls -lh build/ios/archive/Runner.xcarchive
          echo "SDK VERSION CHECK"
          xcrun --show-sdk-version --sdk iphoneos

      - name: Upload xcarchive iOS 26 SDK - 149MB - NO FIRESTORE - VALID
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-xcarchive-iOS26-VALID-FINAL-149MB-NO-FIRESTORE
          path: build/ios/archive/Runner.xcarchive
