name: Build iOS IPA - macOS 15 Xcode 26 iOS 26 SDK - FIX -G via xcconfig sed

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.38.1 - Support Xcode 26
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'

      - name: Select Xcode 26.0.1 - iOS 26.0 SDK
        run: |
          ls /Applications/ | grep -i xcode
          if [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Flutter clean + pub get
        run: |
          flutter clean
          flutter pub get

      - name: Pod install + FIX -G flag in xcconfig (not Podfile)
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          echo "=== Removing -G flag from xcconfig files ==="
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; || true
          find Pods -name "*.xcconfig" -type f -exec grep -l "OTHER_LDFLAGS" {} \; | head -5
          echo "Fixed xcconfig"
          cd ..

      - name: Build IPA iOS 26 SDK - no-codesign - 149MB
        run: |
          flutter build ipa --release --no-codesign
          ls -lh build/ios/archive/Runner.xcarchive

      - name: Upload xcarchive iOS 26 SDK - 149MB - VALID
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-xcarchive-iOS26-VALID-FINAL-149MB
          path: build/ios/archive/Runner.xcarchive
