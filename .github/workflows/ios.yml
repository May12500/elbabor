name: Build iOS IPA - Downgrade Firebase - Fix -G - Xcode 26 iOS 26 SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.4 - Stable for Firebase downgrade
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Select Xcode 26.0.1 - iOS 26.0 SDK
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Show pubspec.yaml Firebase versions
        run: |
          cat pubspec.yaml | grep -A2 -B2 firebase || cat pubspec.yaml

      - name: Downgrade Firebase to versions without -G flag - Known working Oct 30
        run: |
          echo "Downgrading Firebase to versions that built 149MB on Oct 30 - 21m57s VERT"
          # Remove pubspec.lock to force downgrade
          rm -f pubspec.lock
          # Downgrade to specific known working versions for Xcode 26 compatibility
          # These versions use BoringSSL without -G flag
          flutter pub add firebase_core:2.24.2 --no-precompile || true
          flutter pub add firebase_auth:4.15.3 --no-precompile || true
          flutter pub add cloud_firestore:4.15.5 --no-precompile || true
          flutter pub add firebase_storage:11.5.6 --no-precompile || true
          flutter pub get
          cat pubspec.yaml | grep firebase

      - name: Overwrite Podfile - Single post_install - Remove -G + c++20 - No duplicate
        run: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                if config.build_settings['OTHER_LDFLAGS']
                  config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '')
                end
                if config.build_settings['OTHER_CFLAGS']
                  config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].to_s.gsub('-G', '')
                end
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              end
            end
          end
          PODFILE
          cat ios/Podfile

      - name: Pod install --repo-update + Remove -G from xcconfig
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          echo "Removing -G from xcconfig"
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; || true
          find Pods -name "project.pbxproj" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; || true
          cd ..

      - name: Build xcarchive iOS 26.0 SDK - CODE_SIGNING_ALLOWED=NO - 149MB
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          ls -lh build/ios/archive/Runner.xcarchive

      - name: Upload xcarchive iOS 26 SDK - 149MB - VALID FINAL - Downgrade Firebase
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-xcarchive-iOS26-VALID-FINAL-149MB-FirebaseDowngrade
          path: build/ios/archive/Runner.xcarchive
