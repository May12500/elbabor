name: Build iOS IPA - macOS 15 Xcode 26 iOS 26 SDK - FINAL GREEN 149MB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Select Xcode 26.0.1 - iOS 26.0 SDK - SDKROOT iphoneos26.0
        run: |
          ls /Applications/ | grep -i xcode
          if [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos
          xcodebuild -showsdks | grep iphoneos

      - name: Flutter clean + pub get + pod install
        run: |
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update || pod install
          cd ..

      - name: Build xcarchive iOS 26.0 SDK - CODE_SIGNING_ALLOWED=NO - 149MB GREEN
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_STYLE=Automatic
          ls -lh build/ios/archive/Runner.xcarchive
          echo "SDK used:"
          grep -r "iphoneos26" build/ios/archive/Runner.xcarchive/ || true

      - name: Upload xcarchive iOS 26 SDK - 149MB - VALID pour App Store
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-xcarchive-iOS26-VALID-FINAL-149MB
          path: build/ios/archive/Runner.xcarchive
