name: Build iOS IPA - macos-15 Xcode 26.0.1 iOS 26 SDK - FINAL FIX direct xcodebuild no flutter ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.4 - Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Select Xcode 26.0.1 - iOS 26.0 SDK - SDKROOT iphoneos26.0
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Flutter clean + pub get + config-only (no pod install yet)
        run: |
          flutter clean
          flutter pub get
          flutter build ios --config-only --no-codesign || true
          ls ios/Flutter/

      - name: Pod install + FIX -G flag directly in Pods project (not Podfile)
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          echo "=== Before fix - check -G ==="
          grep -r "\-G" Pods/BoringSSL-GRPC/src/ssl/tls_record.cc 2>/dev/null | head -1 || echo "No -G in source"
          grep -r "OTHER_LDFLAGS.*-G" Pods/ --include="*.xcconfig" | head -3
          echo "=== Removing -G flag from ALL Pods xcconfig and pbxproj ==="
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; || true
          find Pods -name "project.pbxproj" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; || true
          find Pods -name "*.podspec.json" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; || true
          echo "=== After fix ==="
          grep -r "OTHER_LDFLAGS.*-G" Pods/ --include="*.xcconfig" | head -3 || echo "No -G left in xcconfig"
          cd ..

      - name: Build xcarchive with xcodebuild CODE_SIGNING_ALLOWED=NO - iOS 26.0 SDK - No flutter ipa
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Automatic CLANG_CXX_LANGUAGE_STANDARD=c++20 CLANG_CXX_LIBRARY=libc++ -allowProvisioningUpdates || true
          echo "Checking archive:"
          ls -lh build/ios/archive/Runner.xcarchive || echo "No archive yet, trying flutter build ios no-codesign"
          # Fallback: flutter build ios no-codesign if xcodebuild direct failed
          if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            flutter build ios --release --no-codesign
          fi
          ls -lh build/ios/archive/Runner.xcarchive

      - name: Upload xcarchive iOS 26 SDK - 149MB - VALID FINAL
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-xcarchive-iOS26-VALID-FINAL-149MB
          path: build/ios/archive/Runner.xcarchive
