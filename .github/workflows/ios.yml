name: Build iOS IPA - macos-15 Xcode 26.0.1 iOS 26 SDK - Fix -G after pod install

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.38.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'

      - name: Select Xcode 26.0.1 - iOS 26.0 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Overwrite Podfile - Single post_install - Remove -G + c++20
        run: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                if config.build_settings['OTHER_LDFLAGS']
                  config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '')
                end
                if config.build_settings['OTHER_CFLAGS']
                  config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].to_s.gsub('-G', '')
                end
                if config.build_settings['OTHER_CPLUSPLUSFLAGS']
                  config.build_settings['OTHER_CPLUSPLUSFLAGS'] = config.build_settings['OTHER_CPLUSPLUSFLAGS'].to_s.gsub('-G', '')
                end
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              end
            end
          end
          PODFILE
          cat ios/Podfile

      - name: Flutter clean + pub get + config-only - Generate Generated.xcconfig
        run: |
          flutter clean
          flutter pub get
          flutter pub upgrade
          flutter precache --ios
          flutter build ios --config-only --no-codesign --release
          ls ios/Flutter/
          cat ios/Flutter/Generated.xcconfig | head -20

      - name: Pod deintegrate + install + Remove -G FINAL
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate || true
          rm -rf Pods
          pod install --repo-update
          echo "=== PATCHING -G in all places ==="
          # Patch xcconfig
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/ -G / /g; s/-G//g' {} \; || true
          # Patch podspecs that contain -G
          find Pods -name "*.podspec.json" -o -name "*.podspec" | xargs grep -l "\-G" | xargs sed -i '' 's/"-G"//g; s/ -G//g; s/-G//g' || true
          # Patch Pods.xcodeproj
          sed -i '' 's/ -G//g; s/ -G / /g' Pods/Pods.xcodeproj/project.pbxproj || true
          # Patch BoringSSL-GRPC specific
          grep -r "OTHER_LDFLAGS.*-G" Pods/ --include="*.xcconfig" | head -5 || echo "No -G left in xcconfig - OK"
          grep -r '"-G"' Pods/BoringSSL-GRPC/ || echo "No -G in BoringSSL-GRPC podspec - OK"
          cd ..

      - name: Build xcarchive xcodebuild - CODE_SIGNING_ALLOWED=NO - iOS 26 SDK
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" 2>&1 | tee build.log
          echo "=== TAIL LOG ==="
          tail -100 build.log
          ls -lh build/ios/archive/Runner.xcarchive || (echo "ARCHIVE FAILED - check log"; cat build.log | grep -A5 "error:"; exit 1)

      - name: Upload xcarchive iOS 26 SDK - 149MB
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-xcarchive-iOS26-VALID-FINAL-149MB
          path: build/ios/archive/Runner.xcarchive
