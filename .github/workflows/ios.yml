name: Build iOS IPA - macos-15 Xcode 26.0.1 iOS 26 SDK - Fix Run Script + BoringSSL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.38.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'

      - name: Select Xcode 26.0.1 - iOS 26.0 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Restore pubspec.yaml if backup exists
        run: |
          if [ -f pubspec.yaml.backup ]; then cp pubspec.yaml.backup pubspec.yaml; fi
          cat pubspec.yaml | grep -E "cloud_firestore|firebase_core" || true

      - name: Overwrite Podfile - Single post_install - Remove -G + c++20 + Exclude BoringSSLRPC bad xcconfig
        run: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_LDFLAGS']
                config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_CFLAGS']
                config.build_settings['OTHER_CPLUSPLUSFLAGS'] = config.build_settings['OTHER_CPLUSPLUSFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_CPLUSPLUSFLAGS']
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                # Fix BoringSSLRPC missing xcconfig - don't use base configuration file
                if target.name.include?('BoringSSL') || target.name.include?('BoringSSL')
                  config.base_configuration_reference = nil
                end
              end
            end
            # Force remove reference to missing BoringSSLRPC xcconfig
            installer.pods_project.build_configurations.each do |config|
              config.base_configuration_reference = nil if config.base_configuration_reference && config.base_configuration_reference.real_path.to_s.include?('BoringSSLRPC')
            end
          end
          PODFILE
          cat ios/Podfile

      - name: Flutter clean + pub get + upgrade + config-only
        run: |
          flutter clean
          flutter pub get
          flutter pub upgrade
          flutter precache --ios
          flutter build ios --config-only --no-codesign --release || true
          ls ios/Flutter/

      - name: Pod deintegrate + install + Remove -G
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate || true
          rm -rf Pods
          pod install --repo-update
          echo "Removing -G from all xcconfig"
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/ -G / /g; s/-G//g' {} \; || true
          # Remove baseConfigurationReference for BoringSSLRPC that causes missing xcconfig
          sed -i '' '/BoringSSLRPC.*xcconfig/d' Pods/Pods.xcodeproj/project.pbxproj || true
          ls Pods/Target\ Support\ Files/ | grep -i boring || echo "Check boring"
          cd ..

      - name: Build xcarchive with flutter build ipa --no-codesign - iOS 26 SDK
        run: |
          flutter build ipa --no-codesign --release --export-options-plist=ios/Runner/ExportOptions.plist 2>&1 || flutter build ios --release --no-codesign
          # If flutter build ipa succeeded, find xcarchive
          find build -name "*.xcarchive" -type d || true
          # Also try xcodebuild archive with proper Flutter env
          if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" -allowProvisioningUpdates 2>&1 | tail -100
          fi
          ls -lh build/ios/archive/ || ls -lh build/ios/ipa/ || ls -lh build/

      - name: Upload xcarchive iOS 26 SDK - 149MB
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-xcarchive-iOS26-VALID-FINAL-149MB
          path: |
            build/ios/archive/Runner.xcarchive
            build/ios/ipa/*.ipa
            build/**/*.xcarchive
