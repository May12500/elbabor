name: Build iOS IPA - macOS 15 Xcode 26 iOS 26 SDK - FIX allowProvisioningUpdates - FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.4 - Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Select Xcode 26 - iOS 26 SDK - Fix 90725 SDK version issue
        run: |
          ls /Applications/ | grep -i xcode
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Create ExportOptions.plist - App Store - Team 8P9JZZ535V
        run: |
          cat > ios/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>8P9JZZ535V</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          cat ios/ExportOptions.plist

      - name: Flutter clean + pub get + pod install
        run: |
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update || pod install
          cd ..

      - name: Build IPA iOS 26 SDK - Signed - FIX allowProvisioningUpdates
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist -- -allowProvisioningUpdates
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List IPA - Verify iOS 26 SDK - Fix boucle 90725
        run: |
          ls -lh build/ios/ipa/
          ls -lh build/ios/archive/ || true
          echo "IPA built with iOS 26 SDK - Ready for Transporter - No more 17.2 SDK"

      - name: Upload IPA + xcarchive - iOS 26 SDK - VALID FINAL
        uses: actions/upload-artifact@v4
        with:
          name: Baborensemble-iOS26-IPA-VALID-FINAL
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive
