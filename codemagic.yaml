workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update
          
          # Éradication permanente du flag -G dans tous les fichiers podspec et json téléchargés
          find . -type f \( -name "*.podspec" -o -name "*.json" -o -name "*.plist" -o -name "*.xcconfig" -o -name "*.pbxproj" \) -print0 | xargs -0 sed -i '' 's/-G\b//g'

      - name: "2-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          
          # Double sécurité : purge juste avant la compilation d'archive
          find ios -type f \( -name "*.xcconfig" -o -name "*.pbxproj" \) -print0 | xargs -0 sed -i '' 's/-G\b//g'
          
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipas