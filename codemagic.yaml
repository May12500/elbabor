workflows:
  ios-baborensemble-intel:
    name: Baborensemble iOS 18.4 SDK - 149MB - Transporter FINAL TURBO 3.38 FIX
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4
      flutter: 3.38.1
      cocoapods: 1.17.0
    scripts:
      - name: Xcode Version
        script: |
          xcodebuild -version

      - name: Flutter clean + Podfile
        script: |
          set -e
          flutter --version
          flutter clean
          flutter pub get
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['CLANG_ENABLE_EXPLICIT_MODULES'] = 'NO'
              end
            end
          end
          PODFILE
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build IPA - TURBO BG remover FIX BoringSSL
        script: |
          set -e
          set -o pipefail
          echo "TURBO remover FIX - only ' -G' with space"
          (
          while true; do
            find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null || true
            find $HOME/Library/Developer/Xcode/DerivedData -name "*.resp" -type f -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null || true
          done
          ) &
          BG_PID=$!
          sleep 1
          flutter build ipa --release --export-method app-store --no-codesign 2>&1 | tee build.log
          kill $BG_PID || true
          ls -lh build/ios/ipa/ || true
          ls -lh build/ios/archive/ || true

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - build.log
