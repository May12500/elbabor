workflows:
  ios-134-fix-no-profiles:
    name: BUILD 134 FIX No profiles App Development - FORCE DISTRIBUTION
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: Select Xcode 26.2
        script: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || true
      - name: Overwrite Podfile
        script: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            p = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            raise "#{p} must exist." unless File.exist?(p)
            File.foreach(p) do |line|
              m = line.match(/FLUTTER_ROOT=(.*)/)
              return m[1].strip if m
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                ['OTHER_CFLAGS','OTHER_CPLUSPLUSFLAGS','OTHER_LDFLAGS'].each do |k|
                  config.build_settings[k] = config.build_settings[k].to_s.gsub(/\s-G(\s|$)/, ' ').gsub(' -G', '').strip if config.build_settings[k]
                end
                config.build_settings['CLANG_USE_RESPONSE_FILE'] = 'NO'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          PODFILE
      - name: Flutter clean and pub get
        script: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get
      - name: Pod install
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          find . -type f -name "*.xcconfig" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; || true
          cd ..
      - name: Flutter config-only
        script: |
          flutter build ios --config-only --no-codesign --release
      - name: PATCH project.pbxproj FORCE DISTRIBUTION + use-profiles
        script: |
          echo "=== BEFORE PATCH ==="
          grep -A2 "CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj | head -n 30 || true
          
          # Force Manual + Apple Distribution + Team + Profile Specifier
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = Apple Development/CODE_SIGN_IDENTITY = Apple Distribution/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' ios/Runner.xcodeproj/project.pbxproj || true
          
          # Add provisioning profile specifier if not exists
          # For Release config
          /usr/bin/python3 << 'PY'
          import re
          path="ios/Runner.xcodeproj/project.pbxproj"
          txt=open(path).read()
          # Force DEVELOPMENT_TEAM = 8P9JZZ535V everywhere
          txt=re.sub(r'DEVELOPMENT_TEAM = [A-Z0-9]+;', 'DEVELOPMENT_TEAM = 8P9JZZ535V;', txt)
          # Replace any empty DEVELOPMENT_TEAM
          txt=txt.replace('DEVELOPMENT_TEAM = "";', 'DEVELOPMENT_TEAM = 8P9JZZ535V;')
          
          # Ensure CODE_SIGN_STYLE Manual and Distribution for Runner target
          # Simple approach: replace all occurrences in Release sections
          def patch_block(txt):
              # Add provisioning specifier after CODE_SIGN_STYLE line
              def add_specifier(match):
                  block=match.group(0)
                  if "PROVISIONING_PROFILE_SPECIFIER" not in block:
                      block=block.replace(match.group(1), match.group(1) + '
				PROVISIONING_PROFILE_SPECIFIER = "Baborensemble AppStore 2027 FINAL";
				PROVISIONING_PROFILE = "";')
                  else:
                      block=re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', 'PROVISIONING_PROFILE_SPECIFIER = "Baborensemble AppStore 2027 FINAL";', block)
                  return block
              # Patch every buildSettings block
              txt=re.sub(r'(CODE_SIGN_STYLE = Manual;)', add_specifier, txt)
              return txt
          
          txt=patch_block(txt)
          open(path,'w').write(txt)
          print("Patched pbxproj")
          PY
          
          echo "=== AFTER PATCH ==="
          grep -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj | sort | uniq | head -n 50
          
          echo "=== Keychain and Profiles ==="
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v
          echo "=== Installed profiles decoded ==="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "File: $f"
            security cms -D -i "$f" | plutil -p - | grep -E "Name|TeamIdentifier|application-identifier" | head -n 10
          done
          
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>8P9JZZ535V</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.baborensemble.app</key>
              <string>Baborensemble AppStore 2027 FINAL</string>
            </dict>
          </dict>
          </plist>
          PLIST
          cat ios/Runner/ExportOptions.plist
      - name: Build IPA
        script: |
          (while true; do
            find ios/Pods -type f -name "*.xcconfig" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -type f \( -name "*.xcconfig" -o -name "*.resp" \) -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
            sleep 0.05
          done) &
          TURBO_PID=$!
          trap "kill $TURBO_PID || true" EXIT
          set -e
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/archive/Runner.xcarchive -destination "generic/platform=iOS" CLANG_USE_RESPONSE_FILE=NO COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM=8P9JZZ535V PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL" clean archive | tee archive.log
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/Runner/ExportOptions.plist | tee export.log
          kill $TURBO_PID || true
          ls -lh build/ios/ipa/
          du -h build/ios/ipa/*.ipa
          xcrun --show-sdk-version --sdk iphoneos
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - archive.log
      - export.log
