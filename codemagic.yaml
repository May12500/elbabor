workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-PATCH clang"
        script: |
          set -e
          CLANG="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CLANGPP="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          sudo rm -f "${CLANG}.real" "${CLANGPP}.real"
          sudo cp "$CLANG" "${CLANG}.real"
          sudo cp "$CLANGPP" "${CLANGPP}.real"

      - name: "2-Setup Signing"
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: "3-Inject Pods Anti-Signing Fix & Build"
        script: |
          set -e
          flutter pub get
          cd ios
          
          # Injecte la règle anti-signature pour tous les Pods dans le Podfile si elle n'y est pas déjà
          if ! grep -q "CODE_SIGNING_ALLOWED" Podfile; then
            echo "" >> Podfile
            echo "post_install do |installer|" >> Podfile
            echo "  installer.pods_project.targets.each do |target|" >> Podfile
            echo "    flutter_additional_ios_build_settings(target) if defined?(flutter_additional_ios_build_settings)" >> Podfile
            echo "    target.build_configurations.each do |config|" >> Podfile
            echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> Podfile
            echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> Podfile
            echo "      config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''" >> Podfile
            echo "      config.build_settings['CODE_SIGN_IDENTITY'] = ''" >> Podfile
            echo "    end" >> Podfile
            echo "  end" >> Podfile
            echo "end" >> Podfile
          fi
          
          pod install
          cd ..

          # Lancement du build IPA final
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa