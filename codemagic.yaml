workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Préparation et Dépendances"
        script: |
          set -e
          flutter pub get
          cd ios
          pod install

      - name: "2-Build IPA via Flutter"
        script: |
          set -e
          # Applique les certificats et profils de Codemagic au projet Xcode
          xcode-project use-profiles
          
          # Génère l'IPA signé avec la configuration exacte de Codemagic
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(echo $BUILD_NUMBER) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa