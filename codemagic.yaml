workflows:
  ios-26-sdk-build-115-fix:
    name: iOS 26 SDK - BUILD 115 FIX ExportOptions
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.38.1
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Use profiles from Codemagic
        script: |
          xcode-project use-profiles
      - name: Create ExportOptions.plist
        script: |
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//【entity-Apple¦canonical_name=Apple】//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>8P9JZZ535V</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          cat ios/Runner/ExportOptions.plist
      - name: Clean + Pods + TURBO remove -G
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; sleep 0.2; done) &
          TURBO_PID=$!
          flutter clean
          flutter pub get
          cd ios && pod install --repo-update
          cd ..
          kill $TURBO_PID || true
      - name: Build IPA with iOS 26 SDK + TURBO
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; find . -name "common-args.resp" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null; sleep 0.2; done) &
          TURBO_PID=$!
          flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist
          kill $TURBO_PID || true
    artifacts:
      - build/ios/ipa/*.ipa