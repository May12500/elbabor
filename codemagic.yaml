workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-PATCH clang"
        script: |
          set -e
          CLANG="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CLANGPP="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          sudo rm -f "${CLANG}.real" "${CLANGPP}.real"
          sudo cp "$CLANG" "${CLANG}.real"
          sudo cp "$CLANGPP" "${CLANGPP}.real"

      - name: "2-Purge & Setup Signing"
        script: |
          set -e
          # Nettoie toute trace de l'ancien profil dans le projet
          python3 -c '
          import glob, re
          for filepath in glob.glob("ios/**/*", recursive=True):
              if filepath.endswith((".pbxproj", ".plist", ".xcconfig")):
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  new_content = content.replace("Baborensemble AppStore 2027 FINAL", "")
                  new_content = re.sub(r"CODE_SIGN_STYLE = Manual;", "CODE_SIGN_STYLE = Automatic;", new_content)
                  if content != new_content:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(new_content)
          '

          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: "3-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter pub get
          cd ios
          pod install

      - name: "4-Build IPA"
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa