workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Purge -G flag from Xcode workspace"
        script: |
          # Correction : Utilisation d'un find sécurisé avec -print0 et xargs -0 pour éviter les erreurs d'espaces
          find ios -name "*.pbxproj" -print0 | xargs -0 sed -i '' 's/-G\b//g'
          find ios -name "*.xcconfig" -print0 | xargs -0 sed -i '' 's/-G\b//g'

      - name: "3-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa