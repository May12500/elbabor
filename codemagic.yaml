workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          # Purge complète des caches
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods
          pod cache clean --all || true
          
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          
          # --- NEUTRALISATION TOTALE ET AGRESSIVE ---
          # Parcourt TOUS les fichiers du projet (sources, configs, cmake) et supprime l'option -G
          echo "Nettoyage radical de tout résidu -G dans le workspace..."
          find . -type f \( -name "*.xcconfig" -o -name "*.pbxproj" -o -name "*.cmake" -o -name "CMakeLists.txt" -o -name "*.cc" -o -name "*.h" -o -name "*.m" \) -exec sed -i '' 's/-G\b//g' {} +
          # ----------------------------------------

          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa