workflows:
  ios-baborensemble-intel:
    name: Baborensemble iOS 26.2 SDK - Mac Intel - 149MB - Transporter
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
    scripts:
      - name: Xcode 26.2 - iOS 26.2 SDK - Version Check
        script: |
          set -e
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Flutter clean + pub upgrade Firebase + Podfile FINAL BOSS 2
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter pub upgrade
          flutter precache --ios
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub(' -G', '') if config.build_settings['OTHER_LDFLAGS']
                config.build_settings['OTHER_CFLAGS'] = '-w -Wno-everything -Wno-error -Wno-error=deprecated-declarations -Wno-error=implicit-function-declaration -DNDEBUG -DOPENSSL_NO_ASM'
                config.build_settings['OTHER_CPLUSPLUSFLAGS'] = '-w -std=c++20 -Wno-everything -Wno-error -fpermissive -DNDEBUG'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['CLANG_ENABLE_MODULES'] = 'NO'
                config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
                config.build_settings['CLANG_WARN_EVERYTHING'] = 'NO'
                config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS'] = 'NO'
                config.build_settings['CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER'] = 'NO'
                config.build_settings['CLANG_WARN_DOCUMENTATION_COMMENTS'] = 'NO'
                config.build_settings['GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS'] = 'NO'
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_C_LANGUAGE_STANDARD'] = 'gnu11'
                config.build_settings['GCC_C_LANGUAGE_STANDARD'] = 'gnu11'
              end
            end
          end
          PODFILE
          pod repo update
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate
          rm -rf Pods
          pod install --repo-update
          cd ..
          flutter build ios --config-only --no-codesign --release
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \;

      - name: Patch BoringSSL - Remove Werror + Warnings from ALL xcconfigs + x509 files
        script: |
          set -e
          cd ios
          echo "=== REMOVE -Werror -Weverything -Wall from xcconfigs ==="
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/-Werror//g' {} \;
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/-Weverything//g' {} \;
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/-Wall//g' {} \;
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \;
          echo "=== PATCH ALL BoringSSL .c .cc with #pragma ==="
          find Pods/BoringSSL-GRPC -name "*.c" -o -name "*.cc" | while read F; do
            if [ -f "$F" ]; then
              printf '#pragma clang diagnostic push
#pragma clang diagnostic ignored "-Weverything"
#pragma clang diagnostic ignored "-Werror"
#pragma clang diagnostic ignored "-Wdeprecated-declarations"
#pragma clang diagnostic ignored "-Wimplicit-function-declaration"
#pragma clang diagnostic ignored "-Wunused-function"
#pragma clang diagnostic ignored "-Wunused-variable"
' > /tmp/head.h
              cat /tmp/head.h "$F" > /tmp/new.c
              echo "#pragma clang diagnostic pop" >> /tmp/new.c
              mv /tmp/new.c "$F"
            fi
          done
          echo "Patched $(find Pods/BoringSSL-GRPC -name "*.c" | wc -l) files"
          echo "=== Force -w in Pods.xcodeproj ==="
          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/GCC_TREAT_WARNINGS_AS_ERRORS = YES/GCC_TREAT_WARNINGS_AS_ERRORS = NO/g' Pods/Pods.xcodeproj/project.pbxproj
            sed -i '' 's/CLANG_WARN_EVERYTHING = YES/CLANG_WARN_EVERYTHING = NO/g' Pods/Pods.xcodeproj/project.pbxproj
          fi
          cd ..

      - name: Remove -G from ALL xcconfigs
        script: |
          set -e
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \;
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \;
          grep -R " -G" ios/Pods/Target\ Support\ Files/ || echo "No -G in Pods - OK VERT"

      - name: Build xcarchive - iOS 26.2 SDK - FINAL BOSS 2 - 149MB
        script: |
          set -e
          set -o pipefail
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-Werror//g' {} \;
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-Werror//g' {} \;
          mkdir -p build/ios/archive
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" GCC_WARN_INHIBIT_ALL_WARNINGS=YES CLANG_WARN_EVERYTHING=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO OTHER_CFLAGS="-w -Wno-everything -Wno-error" OTHER_CPLUSPLUSFLAGS="-w -std=c++20 -Wno-everything -Wno-error -fpermissive" CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES 2>&1 | tee build.log
          ls -lh build/ios/archive/Runner.xcarchive
          du -sh build/ios/archive/Runner.xcarchive

      - name: Create IPA folder for Transporter
        script: |
          set -e
          ARCHIVE_PATH="build/ios/archive/Runner.xcarchive"
          if [ ! -d "$ARCHIVE_PATH" ]; then
            FOUND=$(find build -name "*.xcarchive" -type d)
            FIRST=$(echo "$FOUND" | head -n 1)
            if [ -n "$FIRST" ]; then
              mkdir -p build/ios/archive
              cp -R "$FIRST" "$ARCHIVE_PATH"
            fi
          fi
          ls -lh build/ios/archive/Runner.xcarchive
          du -sh build/ios/archive/Runner.xcarchive

    artifacts:
      - build/ios/archive/Runner.xcarchive
      - build.log
