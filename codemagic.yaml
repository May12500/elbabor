workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods
          pod cache clean --all || true
          
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build and Archive via Native Xcode"
        script: |
          set -e
          xcode-project use-profiles
          
          flutter build bundle --release
          
          cd ios
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          
          # --- BOUCLIER BINAIRE CLANG CONTRE -G ---
          TOOLCHAIN_DIR="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          
          if [ ! -f "$TOOLCHAIN_DIR/clang.real" ]; then
            sudo mv "$TOOLCHAIN_DIR/clang" "$TOOLCHAIN_DIR/clang.real"
            sudo mv "$TOOLCHAIN_DIR/clang++" "$TOOLCHAIN_DIR/clang++.real"
          fi
          
          cat << 'EOF' > /tmp/clang-shield.sh
          #!/bin/bash
          NEW_ARGS=()
          for arg in "$@"; do
            if [[ "$arg" == @* ]]; then
              resp_file="${arg#@}"
              if [ -f "$resp_file" ]; then
                sed -i '' 's/-G\b//g' "$resp_file"
                sed -i '' '/-G/d' "$resp_file"
              fi
            fi
            if [ "$arg" = "-G" ] || [[ "$arg" == -G* ]]; then
              continue
            fi
            NEW_ARGS+=("$arg")
          done
          exec "$0.real" "${NEW_ARGS[@]}"
          EOF

          chmod +x /tmp/clang-shield.sh
          sudo cp /tmp/clang-shield.sh "$TOOLCHAIN_DIR/clang"
          sudo cp /tmp/clang-shield.sh "$TOOLCHAIN_DIR/clang++"
          # ----------------------------------------

          # Lancement de l'archivage natif
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath /Users/builder/clone/build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL" \
            DEVELOPMENT_TEAM="8P9JZZ535V"

          # Restauration de la toolchain d'origine
          sudo mv -f "$TOOLCHAIN_DIR/clang.real" "$TOOLCHAIN_DIR/clang"
          sudo mv -f "$TOOLCHAIN_DIR/clang++.real" "$TOOLCHAIN_DIR/clang++"

          # Exportation de l'archive vers l'IPA final
          xcodebuild -exportArchive \
            -archivePath /Users/builder/clone/build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath /Users/builder/clone/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa