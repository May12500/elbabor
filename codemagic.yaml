workflows:
  ios-26-sdk-build-118-final-ipa:
    name: iOS 26 SDK - BUILD 118 FINAL IPA - 61MB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: 26.2
      cocoapods: default
      groups:
        - appstore_api
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch DEVELOPMENT + APP STORE profiles + create if missing
        script: |
          app-store-connect fetch-signing-files "com.baborensemble.app" --type IOS_APP_DEVELOPMENT --create || true
          app-store-connect fetch-signing-files "com.baborensemble.app" --type IOS_APP_STORE --create
          keychain add-certificates
      - name: Use profiles
        script: |
          xcode-project use-profiles
      - name: Clean + Pods
        script: |
          flutter clean
          flutter pub get
          cd ios && pod install --repo-update && cd ..
      - name: Build IPA - 61MB
        script: |
          flutter build ipa --release --export-method app-store -v
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa