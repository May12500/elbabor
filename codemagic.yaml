workflows:
  ios-26-sdk-build-121-final:
    name: BUILD 121 P12 ONLY - FINAL IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.38.1
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Set up keychain and add all certs from Codemagic storage
        script: |
          keychain initialize
          # Liste ce que Codemagic a vraiment téléchargé dans le builder
          ls -R ~/Library/MobileDevice/Certificates/ 2>/dev/null || echo "no cert folder"
          ls -R ~/Library/Developer/Xcode/UserData/Certificates/ 2>/dev/null || echo "no xcode cert folder"
          # Ajoute TOUT ce qui est uploadé dans l'onglet iOS certificates (pas besoin de nom)
          keychain add-certificates
      - name: Use provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Fix Turbo -G bug
        script: |
          find . -name "*.resp" -type f -exec sed -i '' 's/ -G//g' {} \; || true
      - name: Build IPA iOS 26 SDK
        script: |
          flutter clean
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist --build-name=1.0.4 --build-number=121
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
