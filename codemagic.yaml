workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          
          # Éradication brutale et globale de l'option -G dans l'ensemble du projet Xcode généré
          find ios -type f \( -name "*.pbxproj" -o -name "*.xcconfig" -o -name "*.h" -o -name "*.m" -o -name "*.c" -o -name "*.cpp" \) -print0 | xargs -0 sed -i '' 's/-G\b//g'
          
          # Nettoyage supplémentaire dans les dossiers de build cachés si présents
          find . -type f -name "*.xcconfig" -print0 | xargs -0 sed -i '' 's/-G\b//g' 2>/dev/null || true

          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa