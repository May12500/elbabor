workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-PATCH clang"
        script: |
          set -e
          CLANG="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CLANGPP="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          sudo rm -f "${CLANG}.real" "${CLANGPP}.real"
          sudo cp "$CLANG" "${CLANG}.real"
          sudo cp "$CLANGPP" "${CLANGPP}.real"

      - name: "2-Initialize Provisioning Profile & Purge"
        script: |
          set -e
          python3 -c '
          import glob
          for filepath in glob.glob("ios/**/*", recursive=True):
              if filepath.endswith((".pbxproj", ".plist", ".xcconfig", ".xcodeproj")):
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      new_content = content.replace("Baborensemble AppStore 2027 FINAL", "")
                      if content != new_content:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(new_content)
                  except:
                      pass
          '
          keychain initialize
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: "3-Flutter Dependencies & Pods Clean Shield"
        script: |
          set -e
          flutter pub get
          cd ios
          
          python3 -c '
          import glob
          for filepath in glob.glob("**/*", recursive=True):
              if filepath.endswith((".pbxproj", ".plist", ".xcconfig", ".xcodeproj")):
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      new_content = content.replace("Baborensemble AppStore 2027 FINAL", "")
                      if content != new_content:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(new_content)
                  except:
                      pass
          '
          
          rm -rf Pods Podfile.lock
          
          python3 -c '
          with open("Podfile", "r", encoding="utf-8") as f:
              content = f.read()
          import re
          clean_content = re.sub(r"post_install do \|installer\|.*?end\n?", "", content, flags=re.DOTALL)
          with open("Podfile", "w", encoding="utf-8") as f:
              f.write(clean_content)
          '

          cat << 'EOF' >> Podfile

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target) if defined?(flutter_additional_ios_build_settings)
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['PROVISIONING_PROFILE'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              end
            end
          end
          EOF

          pod install

      - name: "4-Build IPA"
        script: |
          set -e
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          echo "Profil valide utilisé : $PROFILE_NAME"

          cat << EOF > /tmp/clean_export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>8P9JZZ535V</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

          flutter build ipa --release \
            --export-options-plist=/tmp/clean_export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa