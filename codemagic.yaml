workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          
          # --- SOLUTION RADICALE : WRAPPER CLANG ---
          # On crée un faux 'clang' et 'clang++' dans un dossier temporaire prioritaire dans le PATH.
          # Ce wrapper lit tous les arguments reçus, ignore et supprime '-G', puis transmet le reste au vrai compilateur Apple.
          
          mkdir -p /tmp/compiler-wrapper
          
          cat << 'EOF' > /tmp/compiler-wrapper/clang
          #!/bin/sh
          NEW_ARGS=""
          skip_next=false
          for arg in "$@"; do
            if [ "$skip_next" = true ]; then
              skip_next=false
              continue
            fi
            if [ "$arg" = "-G" ]; then
              # Si -G est sous la forme -G valeur, on saute aussi l'argument suivant si nécessaire, 
              # mais ici -G est un drapeau booléen isolé. On le saute simplement.
              continue
            fi
            # Si le drapeau commence par -G (ex: -G...)
            case "$arg" in
              -G*) continue ;;
            esac
            NEW_ARGS="$NEW_ARGS \"$arg\""
          done
          eval /usr/bin/clang $NEW_ARGS
          EOF

          cat << 'EOF' > /tmp/compiler-wrapper/clang++
          #!/bin/sh
          NEW_ARGS=""
          for arg in "$@"; do
            if [ "$arg" = "-G" ]; then
              continue
            fi
            case "$arg" in
              -G*) continue ;;
            esac
            NEW_ARGS="$NEW_ARGS \"$arg\""
          done
          eval /usr/bin/clang++ $NEW_ARGS
          EOF

          chmod +x /tmp/compiler-wrapper/clang /tmp/compiler-wrapper/clang++
          
          # On force le système à utiliser notre wrapper avant le compilateur par défaut
          export PATH="/tmp/compiler-wrapper:$PATH"
          # ----------------------------------------

          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa