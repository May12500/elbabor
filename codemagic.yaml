workflows:
  ios-26-sdk-build-130-final:
    name: BUILD 130 FINAL - FIX HANG - TURBO V3 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Select Xcode 26.2 - iOS 26.2 SDK
        script: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || true
          xcodebuild -version
      - name: Overwrite Podfile - HARD REMOVE -G
        script: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                ['OTHER_CFLAGS','OTHER_CPLUSPLUSFLAGS','OTHER_LDFLAGS'].each do |key|
                  if config.build_settings[key]
                    config.build_settings[key] = config.build_settings[key].to_s.gsub('-G','').gsub('  ',' ').strip
                  end
                end
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['CLANG_USE_RESPONSE_FILE'] = 'NO'
              end
            end
            Dir.glob("Pods/Target Support Files/**/*.xcconfig").each do |xcconfig|
              text = File.read(xcconfig)
              new_text = text.gsub(/\s-G(\s|$)/, ' ').gsub('-G','')
              File.write(xcconfig, new_text) if text != new_text
            end
          end
          PODFILE
      - name: Flutter clean + pub get ONLY (no hang)
        script: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get
          ls -lh ios/Flutter/
      - name: Pod install + Patch -G on disk
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          echo "PATCH DISK"
          find . -type f -name "*.xcconfig" -exec sed -i '' 's/ -G//g; s/-G//g' {} \; 2>/dev/null || true
          find . -type f -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null || true
          cd ..
      - name: Flutter config-only (fast)
        script: |
          flutter build ios --config-only --no-codesign --release --verbose
          ls -lh ios/Flutter/Generated.xcconfig || true
      - name: Set up keychain + ExportOptions
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>8P9JZZ535V</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.baborensemble.app</key>
              <string>Baborensemble AppStore 2027 FINAL</string>
            </dict>
          </dict>
          </plist>
          PLIST
          cat ios/Runner/ExportOptions.plist
      - name: Build IPA - TURBO V3 live patch + manual archive
        script: |
          echo "Starting TURBO V3"
          (while true; do
            find . -type f -name "*.xcconfig" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null || true
            find . -type f -name "*.resp" -exec sed -i '' -E 's/(^| )\-G($| )/ /g; s/\-G//g' {} \; 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -type f \( -name "*.xcconfig" -o -name "*.resp" \) -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null || true
            sleep 0.05
          done) &
          TURBO_PID=$!
          set -e
          echo "STEP 1 flutter build ios --no-codesign"
          flutter build ios --release --no-codesign --build-name=1.0.4 --build-number=130
          kill $TURBO_PID || true
          sleep 0.5
          (while true; do
            find ~/Library/Developer/Xcode/DerivedData -type f \( -name "*.xcconfig" -o -name "*.resp" \) -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null || true
            sleep 0.05
          done) &
          TURBO_PID=$!
          echo "STEP 2 xcodebuild archive MANUAL"
          xcodebuild -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -archivePath build/ios/archive/Runner.xcarchive             -destination "generic/platform=iOS"             CODE_SIGN_STYLE=Manual             DEVELOPMENT_TEAM=8P9JZZ535V             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL"             CLANG_USE_RESPONSE_FILE=NO             clean archive | tee archive.log
          echo "STEP 3 export IPA"
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive             -archivePath build/ios/archive/Runner.xcarchive             -exportPath build/ios/ipa             -exportOptionsPlist ios/Runner/ExportOptions.plist
          kill $TURBO_PID || true
          ls -lh build/ios/ipa/
          du -h build/ios/ipa/*.ipa
          xcrun --show-sdk-version --sdk iphoneos
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - archive.log
