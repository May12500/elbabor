workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-PATCH clang"
        script: |
          set -e
          CLANG="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CLANGPP="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          sudo rm -f "${CLANG}.real" "${CLANGPP}.real"
          sudo cp "$CLANG" "${CLANG}.real"
          sudo cp "$CLANGPP" "${CLANGPP}.real"

          # Création d'un wrapper pour supprimer l'option obsolète '-G' rejetée par Xcode 26.2
          sudo tee "$CLANG" > /dev/null << 'EOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-G" && "$arg" != "-GCC_WARN_INHIBIT_ALL_WARNINGS" ]]; then
              args+=("$arg")
            fi
          done
          exec "${0}.real" "${args[@]}"
          EOF

          sudo tee "$CLANGPP" > /dev/null << 'EOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-G" && "$arg" != "-GCC_WARN_INHIBIT_ALL_WARNINGS" ]]; then
              args+=("$arg")
            fi
          done
          exec "${0}.real" "${args[@]}"
          EOF

          sudo chmod +x "$CLANG" "$CLANGPP"

      - name: "2-Initialize Code Signing"
        script: |
          set -e
          keychain initialize
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: "3-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter pub get
          cd ios
          pod install

      - name: "4-Build IPA"
        script: |
          set -e
          flutter build ipa --release --no-codesign

          PROFILE_NAME="Baborensemble AppStore 2027 FINAL"

          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     archive \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     DEVELOPMENT_TEAM=8P9JZZ535V \
                     PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          cat << EOF > /tmp/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>8P9JZZ535V</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     -exportPath build/ios/ipa \
                     -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa