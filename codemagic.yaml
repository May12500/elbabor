workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Initialize Code Signing"
        script: |
          set -e
          keychain initialize
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: "2-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "3-Build IPA"
        script: |
          set -e
          # Préparation de la configuration Flutter sans relancer pod install
          flutter build ios --release --no-codesign --config-only

          # Suppression chirurgicale de l'option isolée -G (sans toucher à BoringSSL-GRPC)
          python3 -c '
          import glob, re
          for f in glob.glob("ios/Pods/**/*", recursive=True):
              if f.endswith((".xcconfig", ".pbxproj")):
                  with open(f, "r", errors="ignore") as fp:
                      s = fp.read()
                  s2 = re.sub(r"(?<![\w-])\-G(?![\w-])", "", s)
                  if s != s2:
                      with open(f, "w") as fp:
                          fp.write(s2)
          '

          # Archivage sans forcer PROVISIONING_PROFILE_SPECIFIER en ligne de commande
          # (use-profiles a déjà configuré uniquement la cible Runner)
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     archive

          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)

          cat << EOF > /tmp/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>8P9JZZ535V</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     -exportPath build/ios/ipa \
                     -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa