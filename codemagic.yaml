workflows:
  ios-153-final-clean-profile:
    name: BUILD 153 FINAL CLEAN PROFILE
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: PATCH Toolchain clang strip -G
        script: |
          CLANG="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CLANGPP="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          if [ ! -f "${CLANG}.real" ]; then sudo cp "$CLANG" "${CLANG}.real" && sudo cp "$CLANGPP" "${CLANGPP}.real"; fi
          sudo tee "$CLANG" > /dev/null << 'WRAP'
          #!/bin/bash
          REAL="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang.real"
          ARGS=(); for a in "$@"; do [ "$a" = "-G" ] && continue; ARGS+=("$a"); done; exec "$REAL" "${ARGS[@]}"
          WRAP
          sudo tee "$CLANGPP" > /dev/null << 'WRAP'
          #!/bin/bash
          REAL="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++.real"
          ARGS=(); for a in "$@"; do [ "$a" = "-G" ] && continue; ARGS+=("$a"); done; exec "$REAL" "${ARGS[@]}"
          WRAP
          sudo chmod +x "$CLANG" "$CLANGPP"
          "$CLANG" --version | head -1
      - name: Overwrite Podfile NO-G
        script: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', { 'Debug' => :debug, 'Profile' => :release, 'Release' => :release, }
          def flutter_root; p=File.expand_path(File.join('..','Flutter','Generated.xcconfig'),__FILE__); File.foreach(p){|l| m=l.match(/FLUTTER_ROOT=(.*)/); return m[1].strip if m}; raise "FLUTTER_ROOT"; end
          require File.expand_path(File.join('packages','flutter_tools','bin','podhelper'),flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do; use_frameworks!; use_modular_headers!; flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__)); end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |c|
                c.build_settings['CLANG_USE_RESPONSE_FILE']='NO'; c.build_settings['IPHONEOS_DEPLOYMENT_TARGET']='16.0'; c.build_settings['ENABLE_BITCODE']='NO'
                %w[OTHER_CFLAGS OTHER_CPLUSPLUSFLAGS OTHER_LDFLAGS].each{|k| c.build_settings[k]=c.build_settings[k].gsub('-G','').strip if c.build_settings[k]}
                c.build_settings['COMPILER_FLAGS']=''
                if target.name.include?('BoringSSL')||target.name.include?('gRPC')||target.name.include?('abseil')
                  c.build_settings['OTHER_CFLAGS']='$(inherited) -DOPENSSL_NO_ASM -w'; c.build_settings['OTHER_CPLUSPLUSFLAGS']='$(inherited) -DOPENSSL_NO_ASM -w'
                end
              end
            end
          end
          PODFILE
      - name: Flutter clean pod install
        script: |
          flutter clean; rm -f pubspec.lock; flutter pub get
          cd ios; rm -rf Pods Podfile.lock; pod install --repo-update; find . -type f \( -name "*.xcconfig" -o -name "*.pbxproj" \) -exec sed -i '' 's/ -G / /g; s/-G//g' {} \; || true; cd ..
      - name: Flutter config-only
        script: |
          flutter build ios --config-only --no-codesign --release
      - name: PATCH pbxproj PROFILE
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj || true
          python3 - << 'PY'
          import re; p="ios/Runner.xcodeproj/project.pbxproj"; t=open(p).read(); t=re.sub(r'DEVELOPMENT_TEAM = [^;]+;','DEVELOPMENT_TEAM = 8P9JZZ535V;',t); t=re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";','',t); t=t.replace('CODE_SIGN_STYLE = Manual;','CODE_SIGN_STYLE = Manual; PROVISIONING_PROFILE_SPECIFIER = "Baborensemble AppStore 2027 FINAL";'); open(p,'w').write(t)
          PY
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>app-store</string><key>teamID</key><string>8P9JZZ535V</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>com.baborensemble.app</key><string>Baborensemble AppStore 2027 FINAL</string></dict></dict></plist>
          PLIST
      - name: Setup signing CLEAN SINGLE PROFILE
        script: |
          set -e
          echo "=== ROOT ==="; ls -lh | grep -E "p12|mobileprovision|codemagic"
          keychain initialize
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles; mkdir -p /tmp/certs
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
          echo "=== keychain add-certificates ==="; keychain add-certificates || true
          echo "=== Import p12 babor_new_2027.p12 ==="
          for P12 in ./babor_new_2027.p12 ./elbabor_dist_2027.p12 ./*.p12; do
            if [ -f "$P12" ]; then
              echo "Import $P12"; security import "$P12" -k ~/Library/Keychains/build.keychain -P babor2027 -A -T /usr/bin/codesign -T /usr/bin/security || true
              security import "$P12" -k ~/Library/Keychains/login.keychain -P babor2027 -A -T /usr/bin/codesign -T /usr/bin/security || true
            fi
          done
          echo "=== Identities ==="; security find-identity -v -p codesigning || true
          echo "=== Fetch profiles via API ==="; app-store-connect fetch-signing-files "com.baborensemble.app" --type IOS_APP_STORE --platform IOS --certificates-dir /tmp/certs --profiles-dir ~/Library/MobileDevice/Provisioning\ Profiles || true
          echo "=== Keep only ONE profile Baborensemble AppStore 2027 FINAL ==="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          # If repo has mobileprovision files, use the newest one that matches new cert
          # Decode to find which one links to Ahmed MAIDI 2027
          for f in ./Baborensemble*.mobileprovision ./*.mobileprovision; do [ -f "$f" ] || continue; echo "--- Checking $f"; security cms -D -i "$f" 2>/dev/null | plutil -p - | grep -E "Name|TeamIdentifier|cert" | head -20; done
          # Copy the latest FINAL file explicitly
          LATEST=$(ls -t ./Baborensemble*FINAL*.mobileprovision ./Baborensemble*.mobileprovision 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then echo "Using LATEST profile from repo: $LATEST"; cp "$LATEST" ~/Library/MobileDevice/Provisioning\ Profiles/; fi
          echo "=== FINAL profiles in MobileDevice ==="; ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/; for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do [ -e "$f" ] || continue; echo "--- $f"; security cms -D -i "$f" 2>/dev/null | plutil -p - | grep -A2 -E "Name|com.baborensemble"; done
          xcode-project use-profiles || true
          echo "=== FINAL identities ==="; security find-identity -v -p codesigning
      - name: Build IPA
        script: |
          set -e
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/archive/Runner.xcarchive -destination "generic/platform=iOS" CLANG_USE_RESPONSE_FILE=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM=8P9JZZ535V PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL" clean archive | tee archive.log
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/Runner/ExportOptions.plist | tee export.log
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - archive.log
      - export.log
