workflows:
  ios-26-sdk-build-125-final:
    name: BUILD 125 FINAL - MANUAL SIGNING FIX - IPA 61MB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Select Xcode 26.2 - iOS 26.2 SDK
        script: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Overwrite Podfile - Fix -G + c++20 + classic linker
        script: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_LDFLAGS']
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          PODFILE
      - name: Flutter clean + pub get + upgrade + config-only
        script: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get
          flutter pub upgrade
          flutter precache --ios
          flutter build ios --config-only --no-codesign --release
      - name: Pod install + Remove -G
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate || true
          rm -rf Pods
          pod install --repo-update
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; || true
          sed -i '' 's/ -G//g' Pods/Pods.xcodeproj/project.pbxproj || true
          cd ..
      - name: Set up keychain - Add P12 babor2027 + Create ExportOptions + FORCE MANUAL SIGNING
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v || true
          echo "=== Creating ExportOptions.plist ==="
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>8P9JZZ535V</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.baborensemble.app</key>
              <string>Baborensemble AppStore 2027 FINAL</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          cat ios/Runner/ExportOptions.plist
          echo "=== FORCING MANUAL SIGNING ==="
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX" || true
          /usr/bin/python3 << 'PY'
          import re
          path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(path, 'r') as f:
              txt = f.read()
          # Force Manual
          txt = txt.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          # Ensure all buildSettings blocks have Manual + Team + Identity + Profile
          def fix_block(m):
              block = m.group(0)
              if 'CODE_SIGN_STYLE = Manual;' not in block:
                  block = block.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              if 'PROVISIONING_PROFILE_SPECIFIER' not in block and 'PRODUCT_NAME' in block:
                  block = block.replace('CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Manual;\n                PROVISIONING_PROFILE_SPECIFIER = "Baborensemble AppStore 2027 FINAL";')
              if 'DEVELOPMENT_TEAM' not in block and 'PRODUCT_NAME' in block:
                  block = block.replace('CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Manual;\n                DEVELOPMENT_TEAM = 8P9JZZ535V;')
              block = re.sub(r'CODE_SIGN_IDENTITY = "[^"]*";', 'CODE_SIGN_IDENTITY = "Apple Distribution";', block)
              if 'CODE_SIGN_IDENTITY' not in block and 'PRODUCT_NAME' in block:
                  block = block.replace('PROVISIONING_PROFILE_SPECIFIER', 'CODE_SIGN_IDENTITY = "Apple Distribution";\n                PROVISIONING_PROFILE_SPECIFIER')
              return block
          txt = re.sub(r'buildSettings = \{[^\}]*CODE_SIGN_STYLE = Manual;[^\}]*\};', fix_block, txt, flags=re.DOTALL)
          # Second safety: inject for any Release buildSettings missing specifier
          with open(path, 'w') as f:
              f.write(txt)
          print('Patched')
          PY
          grep -n "CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY" "$PBX" | head -n 20
      - name: Build IPA - iOS 26.2 SDK - Signed 61MB
        script: |
          flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist --build-name=1.0.4 --build-number=125
          xcrun --show-sdk-version --sdk iphoneos
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
