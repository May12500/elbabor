workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          
          # NEUTRALISATION TOTALE DES FICHIERS DE CONFIGURATION GÉNÉRÉS
          # On modifie les xcconfig générés pour y supprimer définitivement toute occurrence de -G
          find ios/Pods -name "*.xcconfig" -print0 | xargs -0 sed -i '' 's/-G\b//g' 2>/dev/null || true
          find ios/Flutter -name "*.xcconfig" -print0 | xargs -0 sed -i '' 's/-G\b//g' 2>/dev/null || true
          
          # On lance le build en mode sans mise à jour automatique des pods pour préserver le nettoyage
          flutter build ipa --release --no-pub --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa