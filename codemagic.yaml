workflows:
  ios-26-sdk-build-126-final:
    name: BUILD 126 FINAL - XCODEBUILD ARCHIVE MANUAL - IPA 61MB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Select Xcode 26.2 - iOS 26.2 SDK
        script: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || true
          xcodebuild -version
      - name: Overwrite Podfile - Fix -G + c++20
        script: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_LDFLAGS']
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          PODFILE
      - name: Flutter clean + pub get + config-only no-codesign
        script: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get
          flutter precache --ios
          flutter build ios --config-only --no-codesign --release
      - name: Pod install + Remove -G
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate || true
          pod install --repo-update
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \; || true
          sed -i '' 's/ -G//g' Pods/Pods.xcodeproj/project.pbxproj || true
          cd ..
      - name: Set up keychain + ExportOptions
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v || true
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>8P9JZZ535V</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.baborensemble.app</key>
              <string>Baborensemble AppStore 2027 FINAL</string>
            </dict>
          </dict>
          </plist>
          PLIST
          cat ios/Runner/ExportOptions.plist
      - name: Build IPA - flutter no-codesign + xcodebuild manual archive + export
        script: |
          echo "=== STEP 1: flutter build ios --no-codesign ==="
          flutter build ios --release --no-codesign --build-name=1.0.4 --build-number=126
          echo "=== STEP 2: xcodebuild archive MANUAL ==="
          xcodebuild -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -archivePath build/ios/archive/Runner.xcarchive             -allowProvisioningUpdates             CODE_SIGN_STYLE=Manual             DEVELOPMENT_TEAM=8P9JZZ535V             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL"             clean archive | xcpretty || xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/archive/Runner.xcarchive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=8P9JZZ535V CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL" clean archive
          echo "=== STEP 3: xcodebuild -exportArchive ==="
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive             -archivePath build/ios/archive/Runner.xcarchive             -exportPath build/ios/ipa             -exportOptionsPlist ios/Runner/ExportOptions.plist
          xcrun --show-sdk-version --sdk iphoneos
          ls -lh build/ios/ipa/
          du -h build/ios/ipa/*.ipa || true
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
