workflows:
  ios-baborensemble-intel:
    name: Baborensemble iOS 26.2 SDK - Mac Intel - 149MB - Transporter
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
    scripts:
      - name: Xcode 26.2 Check
        script: |
          set -e
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Flutter clean + pub get + Podfile
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter precache --ios
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                if config.build_settings['OTHER_LDFLAGS']
                  config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub(' -G', '').gsub('-G', '')
                end
                if config.build_settings['OTHER_CFLAGS']
                  config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].to_s.gsub(' -G', '').gsub('-G', '')
                end
                if config.build_settings['OTHER_CPLUSPLUSFLAGS']
                  config.build_settings['OTHER_CPLUSPLUSFLAGS'] = config.build_settings['OTHER_CPLUSPLUSFLAGS'].to_s.gsub(' -G', '').gsub('-G', '')
                end
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
                config.build_settings['CLANG_WARN_EVERYTHING'] = 'NO'
                config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS'] = 'NO'
              end
            end
          end
          PODFILE
          echo "pod repo update + flutter config-only"
          pod repo update
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate || true
          rm -rf Pods
          pod install --repo-update
          cd ..
          flutter build ios --config-only --no-codesign --release
          echo "Remove -G aggressive"
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          grep -R " -G" ios/ || echo "No -G in ios - OK VERT"

      - name: Pod install - Final
        script: |
          set -e
          cd ios
          pod install --repo-update
          find . -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          find Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          grep -R " -G" . || echo "No -G after second pod install - OK"
          cd ..

      - name: Remove -G from ALL xcconfigs
        script: |
          set -e
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          cat ios/Flutter/Generated.xcconfig | head -20
          grep -R " -G" ios/Pods/Target\ Support\ Files/ || echo "No -G in Pods Target Support Files - OK VERT"

      - name: Build xcarchive - iOS 26.2 SDK - 149MB
        script: |
          set -e
          set -o pipefail
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          mkdir -p build/ios/archive
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" GCC_WARN_INHIBIT_ALL_WARNINGS=YES CLANG_WARN_EVERYTHING=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee build.log
          ls -lh build/ios/archive/Runner.xcarchive
          du -sh build/ios/archive/Runner.xcarchive
          xcrun --show-sdk-version --sdk iphoneos

      - name: Create IPA folder for Transporter
        script: |
          set -e
          ls -lh build/ios/archive/Runner.xcarchive
          du -sh build/ios/archive/Runner.xcarchive

    artifacts:
      - build/ios/archive/Runner.xcarchive
      - build.log
