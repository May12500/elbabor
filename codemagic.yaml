workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods
          pod cache clean --all || true
          
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          
          # --- WRAPPER CLANG ULTIME ---
          # On crée un faux binaire clang/clang++ qui intercepte tous les arguments,
          # supprime définitivement '-G' et transmet le reste au vrai compilateur d'Apple.
          mkdir -p /tmp/bin
          
          cat << 'EOF' > /tmp/bin/clang
          #!/bin/sh
          ARGS=""
          for arg in "$@"; do
            if [ "$arg" = "-G" ]; then
              continue
            fi
            case "$arg" in
              -G*) continue ;;
            esac
            ARGS="$ARGS \"$arg\""
          done
          exec /usr/bin/clang $ARGS
          EOF

          cat << 'EOF' > /tmp/bin/clang++
          #!/bin/sh
          ARGS=""
          for arg in "$@"; do
            if [ "$arg" = "-G" ]; then
              continue
            fi
            case "$arg" in
              -G*) continue ;;
            esac
            ARGS="$ARGS "$arg""
          done
          exec /usr/bin/clang++ $ARGS
          EOF

          chmod +x /tmp/bin/clang /tmp/bin/clang++
          
          # On place notre dossier en tête de PATH pour court-circuiter le compilateur système
          export PATH="/tmp/bin:$PATH"
          # ---------------------------

          flutter build ipa --release --no-pub --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa