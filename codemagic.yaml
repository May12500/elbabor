workflows:
  ios-142-find-p12-manual-import:
    name: BUILD 142 FIND P12 MANUAL IMPORT
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: Select Xcode 26.2 and keychain help
        script: |
          xcodebuild -version
          keychain add-certificates --help || true
          xcode-project use-profiles --help || true
      - name: Overwrite Podfile no -G
        script: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            p = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            raise "#{p} must exist." unless File.exist?(p)
            File.foreach(p) do |line|
              m = line.match(/FLUTTER_ROOT=(.*)/)
              return m[1].strip if m
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['CLANG_USE_RESPONSE_FILE'] = 'NO'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          PODFILE
      - name: Flutter clean and pub get
        script: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get
      - name: Pod install clean -G
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          find . -type f -name "*.xcconfig" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; || true
          cd ..
      - name: Flutter config-only
        script: |
          flutter build ios --config-only --no-codesign --release
      - name: PATCH pbxproj MANUAL
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = Apple Development/CODE_SIGN_IDENTITY = Apple Distribution/g' ios/Runner.xcodeproj/project.pbxproj || true
          python3 << 'PY'
          import re
          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          txt = open(pbx).read()
          txt = re.sub(r'DEVELOPMENT_TEAM = [A-Z0-9]+;', 'DEVELOPMENT_TEAM = 8P9JZZ535V;', txt)
          txt = txt.replace('DEVELOPMENT_TEAM = "";', 'DEVELOPMENT_TEAM = 8P9JZZ535V;')
          txt = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', '', txt)
          txt = re.sub(r'PROVISIONING_PROFILE = "[^"]*";', '', txt)
          open(pbx, 'w').write(txt)
          print("pbx patched no specifier")
          PY
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>8P9JZZ535V</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.baborensemble.app</key>
              <string>Baborensemble AppStore 2027 FINAL</string>
            </dict>
          </dict>
          </plist>
          PLIST
      - name: FIND P12 EVERYWHERE AND MANUAL IMPORT
        script: |
          set -e
          keychain initialize
          echo "=== Search default locations ==="
          ls -la /Users/builder/Library/Developer/Xcode/UserData/Certificates/ || true
          ls -la /Users/builder/Library/MobileDevice/Certificates/ || true
          echo "=== Search all p12 in builder home ==="
          find /Users/builder -type f -name "*.p12" 2>/dev/null | head -n 100 || true
          find /Users/builder -type f -name "*.mobileprovision" 2>/dev/null | head -n 100 || true
          find /tmp -type f -name "*.p12" 2>/dev/null | head -n 100 || true
          env | grep -i cert || true
          env | grep -i profile || true
          echo "=== Try keychain add-certificates (should fail again) ==="
          keychain add-certificates || true
          echo "=== MANUAL IMPORT if found ==="
          P12=$(find /Users/builder -type f -name "*.p12" 2>/dev/null | head -1 || true)
          if [ -z "$P12" ]; then
            echo "No p12 found via find, checking Codemagic env var locations"
            # Codemagic Teams certs are sometimes in /Users/builder/Library/MobileDevice/Certificates but with different perms
            ls -R /Users/builder/Library/ 2>/dev/null | grep -i p12 || true
          else
            echo "Found P12: $P12"
            # Try both passwords user used
            for PASS in "babor2027" ""; do
              echo "Trying import with pass: $PASS"
              security import "$P12" -k /Users/builder/Library/codemagic-cli-tools/keychains/07-11-26_*.keychain-db 2>&1 | head -20 || security import "$P12" -k $(ls /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db | tail -1) -P "$PASS" -T /usr/bin/codesign -T /usr/bin/security || true
            done
          fi
          echo "=== Try alternative: keychain add-certificates with explicit path via env CM_DISTRIBUTION env ==="
          # List codemagic keychain
          KC=$(ls /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db | tail -1)
          echo "Keychain: $KC"
          security find-identity -v -p codesigning "$KC" || true
          security find-identity -v "$KC" || true
          # Try to import from known Codemagic certs dir that Teams UI uses (maybe in /Users/builder/codemagic)
          find / -type f -name "*.p12" 2>/dev/null | grep -v DerivedData | head -n 50 || true
          echo "=== identities in login keychain ==="
          security find-identity -v -p codesigning || true
      - name: Build IPA TURBO V3 AUTO (will fail cert but we see logs)
        script: |
          (while true; do
            find ios/Pods -type f -name "*.xcconfig" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -type f \( -name "*.xcconfig" -o -name "*.resp" \) -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
            sleep 0.05
          done) &
          TURBO_PID=$!
          trap "kill $TURBO_PID || true" EXIT
          set -e
          # Show identities before build
          security find-identity -v -p codesigning || true
          xcode-project use-profiles || true
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/archive/Runner.xcarchive -destination "generic/platform=iOS" CLANG_USE_RESPONSE_FILE=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM=8P9JZZ535V clean archive | tee archive.log
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/Runner/ExportOptions.plist | tee export.log
          kill $TURBO_PID || true
          ls -lh build/ios/ipa/
          du -h build/ios/ipa/*.ipa || true
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - archive.log
      - export.log
