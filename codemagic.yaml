workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-PATCH clang"
        script: |
          set -e
          CLANG="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CLANGPP="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          sudo rm -f "${CLANG}.real" "${CLANGPP}.real"
          sudo cp "$CLANG" "${CLANG}.real"
          sudo cp "$CLANGPP" "${CLANGPP}.real"

      - name: "2-Initialize Provisioning Profile & Purge"
        script: |
          set -e
          python3 -c '
          import glob
          for filepath in glob.glob("ios/**/*", recursive=True):
              if filepath.endswith((".pbxproj", ".plist", ".xcconfig", ".xcodeproj")):
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      new_content = content.replace("Baborensemble AppStore 2027 FINAL", "")
                      if content != new_content:
                          with open(filepath, "w", encoding="utf-8", errors="ignore") as f:
                              f.write(new_content)
                  except:
                      pass
          '
          keychain initialize
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: "3-Flutter Dependencies & Pods Clean Shield"
        script: |
          set -e
          flutter pub get
          cd ios
          
          python3 -c '
          import glob
          for filepath in glob.glob("**/*", recursive=True):
              if filepath.endswith((".pbxproj", ".plist", ".xcconfig", ".xcodeproj")):
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      new_content = content.replace("Baborensemble AppStore 2027 FINAL", "")
                      if content != new_content:
                          with open(filepath, "w", encoding="utf-8", errors="ignore") as f:
                              f.write(new_content)
                  except:
                      pass
          '
          
          pod install

      - name: "4-Build IPA"
        script: |
          set -e
          # Récupération dynamique et sécurisée du profil de distribution installé par Codemagic
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          echo "Utilisation du profil de production : $PROFILE_NAME"

          flutter build ipa --release \
            --dart-define=FLUTTER_WEB_USE_SKIA=true \
            --no-codesign

          # Signature manuelle et robuste via xcodebuild avec les paramètres complets
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     archive \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     DEVELOPMENT_TEAM=8P9JZZ535V \
                     PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          xcodebuild -exportArchive \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     -exportPath build/ios/ipa \
                     -exportOptionsPlist ios/Runner/ExportOptions.plist || \
          {
            # Fallback export options en cas de besoin
            cat << EOF > /tmp/ExportOptions.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>teamID</key>
                <string>8P9JZZ535V</string>
                <key>provisioningProfiles</key>
                <dict>
                    <key>$BUNDLE_ID</key>
                    <string>$PROFILE_NAME</string>
                </dict>
            </dict>
            </plist>
            EOF
            xcodebuild -exportArchive \
                       -archivePath build/ios/archive/Runner.xcarchive \
                       -exportPath build/ios/ipa \
                       -exportOptionsPlist /tmp/ExportOptions.plist
          }

    artifacts:
      - build/ios/ipa/*.ipa