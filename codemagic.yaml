workflows:
  ios-26-sdk-build-121-final:
    name: BUILD 121 P12 ONLY - FINAL IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.38.1
      xcode: 26.2
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - - name: Add certificates
  script: |
    keychain add-certificates --certificate babor2027
      - name: Use provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Fix Turbo -G bug
        script: |
          find . -name "*.resp" -type f -exec sed -i '' 's/ -G//g' {} \; || true
      - name: Build IPA iOS 26 SDK
        script: |
          flutter clean
          flutter pub get
          flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist --build-name=1.0.4 --build-number=121
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_*.log