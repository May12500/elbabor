workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods
          pod cache clean --all || true
          
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build and Archive via Native Xcode"
        script: |
          set -e
          xcode-project use-profiles
          
          flutter build bundle --release
          
          # --- LA VRAIE SOLUTION RADICALE DU COMPILATEUR ---
          # On crée un faux binaire clang et clang++ qui supprime l'option -G de TOUTES les commandes (y compris dans les fichiers .resp)
          mkdir -p /opt/bin
          
          cat << 'EOF' > /opt/bin/clang
          #!/bin/bash
          NEW_ARGS=()
          for arg in "$@"; do
            # Si l'argument est un fichier de réponse (.resp), on le nettoie sur place instantanément !
            if [[ "$arg" == @* ]]; then
              resp_file="${arg#@}"
              if [ -f "$resp_file" ]; then
                sed -i '' 's/-G\b//g' "$resp_file"
              fi
            fi
            
            # On filtre l'option -G si elle est passée directement
            if [ "$arg" = "-G" ] || [[ "$arg" == -G* ]]; then
              continue
            fi
            
            NEW_ARGS+=("$arg")
          done
          exec /Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang "${NEW_ARGS[@]}"
          EOF

          cat << 'EOF' > /opt/bin/clang++
          #!/bin/bash
          NEW_ARGS=()
          for arg in "$@"; do
            if [[ "$arg" == @* ]]; then
              resp_file="${arg#@}"
              if [ -f "$resp_file" ]; then
                sed -i '' 's/-G\b//g' "$resp_file"
              fi
            fi
            
            if [ "$arg" = "-G" ] || [[ "$arg" == -G* ]]; then
              continue
            fi
            
            NEW_ARGS+=("$arg")
          done
          exec /Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++ "${NEW_ARGS[@]}"
          EOF

          chmod +x /opt/bin/clang /opt/bin/clang++
          
          # On force le PATH pour que Xcode utilise notre wrapper en priorité absolue
          export PATH="/opt/bin:$PATH"
          # -----------------------------------------------

          cd ios
          
          # Lancement de l'archivage natif
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath /Users/builder/clone/build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL" \
            DEVELOPMENT_TEAM="8P9JZZ535V"

          # Exportation de l'archive vers l'IPA
          xcodebuild -exportArchive \
            -archivePath /Users/builder/clone/build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath /Users/builder/clone/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa