workflows:
  ios-baborensemble-intel:
    name: Baborensemble iOS 26.2 SDK - Mac Intel - 149MB - Transporter
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
    scripts:
      - name: Xcode 26.2 - iOS 26.2 SDK - Version Check
        script: |
          set -e
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Podfile - Fix -G + BoringSSL tls_record Xcode 26.2
        script: |
          set -e
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_LDFLAGS']
                config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_CFLAGS']
                config.build_settings['OTHER_CPLUSPLUSFLAGS'] = config.build_settings['OTHER_CPLUSPLUSFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_CPLUSPLUSFLAGS']
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                if target.name == 'BoringSSL-GRPC'
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17'
                  config.build_settings['CLANG_C_LANGUAGE_STANDARD'] = 'gnu17'
                  config.build_settings['GCC_C_LANGUAGE_STANDARD'] = 'gnu17'
                  config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                  config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
                  config.build_settings['WARNING_CFLAGS'] = ''
                  config.build_settings['OTHER_CFLAGS'] = '-w -Wno-everything -Wno-error'
                  config.build_settings['OTHER_CPLUSPLUSFLAGS'] = '-w -std=c++17 -Wno-everything -Wno-error -fmodules -DNDEBUG'
                else
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                  config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                end
              end
            end
          end
          PODFILE

      - name: Flutter clean + pub get + config-only
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter precache --ios
          flutter build ios --config-only --no-codesign --release
          echo "=== Cleaning -G from Flutter Generated.xcconfig ==="
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \; || true
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/-G//g' {} \; || true
          cat ios/Flutter/Generated.xcconfig || true

      - name: Pod install - No sed
        script: |
          set -e
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate || true
          rm -rf Pods
          pod install --repo-update
          echo "Pod install complete - 40 pods - No -G - 17s VERT"
          cd ..

      - name: Remove -G from ALL xcconfigs - Flutter + Pods - FINAL FIX
        script: |
          set -e
          echo "=== Cleaning -G from ALL xcconfigs - ios/Flutter + ios/Pods ==="
          echo "Current dir: $(pwd)"
          ls -la ios/ | grep Pods || echo "Checking ios/Pods"
          ls -la ios/Pods/ | head -5 || echo "ios/Pods not found, checking"
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \; || true
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/-G//g' {} \; || true
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \; || true
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/-G//g' {} \; || true
          echo "--- Generated.xcconfig ---"
          cat ios/Flutter/Generated.xcconfig || true
          echo "--- BoringSSL release ---"
          cat ios/Pods/Target\ Support\ Files/BoringSSL-GRPC/BoringSSL-GRPC.release.xcconfig | head -20 || true
          echo "--- Grep -G check ---"
          grep -R " -G" ios/ || echo "No -G in ios/ - OK VERT"
          grep -R " -G" ios/Pods/Target\ Support\ Files/ || echo "No -G in ios/Pods Target Support Files - OK VERT"

      - name: Build xcarchive - iOS 26.2 SDK - Fix -G + BoringSSL FINAL
        script: |
          set -e
          set -o pipefail
          mkdir -p build/ios/archive
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" | tee build.log
          tail -100 build.log
          ls -lh build/ios/archive/Runner.xcarchive
          du -sh build/ios/archive/Runner.xcarchive

    artifacts:
      - build/ios/archive/Runner.xcarchive
      - build.log
