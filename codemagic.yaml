workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-PATCH clang"
        script: |
          set -e
          CLANG="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CLANGPP="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          sudo rm -f "${CLANG}.real" "${CLANGPP}.real"
          sudo cp "$CLANG" "${CLANG}.real"
          sudo cp "$CLANGPP" "${CLANGPP}.real"

      - name: "2-Initialize Code Signing"
        script: |
          set -e
          keychain initialize
          # Codemagic va injecter automatiquement le certificat et le profil configurés dans son interface graphique
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: "3-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter pub get
          cd ios
          pod install

      - name: "4-Build IPA"
        script: |
          set -e
          # Compilation et export gérés nativement par Flutter avec les profils de l'environnement
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa