workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods
          pod cache clean --all || true
          
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          
          # On s'assure que le Podfile a les droits d'écriture pour que Flutter puisse faire sa "mise à niveau"
          chmod 644 ios/Podfile
          
          # Astuce : On laisse Flutter lancer sa phase d'archivage, mais on force un nettoyage 
          # juste avant que l'archive ne compile réellement si possible, 
          # OU on utilise une variable d'environnement globale pour interdire à Clang de planter sur -G.
          
          # Forcer Clang à rétrograder l'erreur -G en simple avertissement non bloquant
          export OTHER_CFLAGS="-Wno-error=unsupported-option"
          export OTHER_CPLUSPLUSFLAGS="-Wno-error=unsupported-option"
          
          flutter build ipa --release --no-pub --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa