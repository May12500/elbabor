workflows:
  ios-26-sdk-build-131-final:
    name: BUILD 131 FINAL - BYPASS FLUTTER BUILD - TURBO V3 ARCHIVE ONLY
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Select Xcode 26.2 - iOS 26.2 SDK
        script: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || true
          xcodebuild -version
      - name: Overwrite Podfile - HARD REMOVE -G FIX
        script: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                # HARD REMOVE -G from all flags
                ['OTHER_CFLAGS','OTHER_CPLUSPLUSFLAGS','OTHER_LDFLAGS','OTHER_SWIFT_FLAGS'].each do |key|
                  if config.build_settings[key]
                    config.build_settings[key] = config.build_settings[key].to_s.gsub(/\s-G(\s|$)/, ' ').gsub(/\s-G$/, '').gsub(/^-G\s/, '').gsub('-G ', '').strip
                  end
                end
                # Force no response file
                config.build_settings['CLANG_USE_RESPONSE_FILE'] = 'NO'
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
            # Also clean xcconfig files on disk
            Dir.glob("Pods/Target Support Files/**/*.xcconfig").each do |xcconfig|
              text = File.read(xcconfig)
              new_text = text.gsub(/\s-G(\s|$)/, ' ').gsub('-G ', '').gsub(' -G', '')
              File.write(xcconfig, new_text) if text != new_text
            end
            Dir.glob("Pods/**/*.xcconfig").each do |xcconfig|
              text = File.read(xcconfig)
              new_text = text.gsub(/\s-G(\s|$)/, ' ').gsub('-G ', '').gsub(' -G', '')
              File.write(xcconfig, new_text) if text != new_text
            end
          end
          PODFILE
          cat ios/Podfile
      - name: Flutter clean + pub get
        script: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get
      - name: Pod install + Aggressive Patch
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          echo "=== PATCHING -G ON DISK ==="
          find . -type f -name "*.xcconfig" -print -exec sed -i '' 's/ -G / /g; s/ -G$//g; s/^ -G//g' {} \; 2>/dev/null || true
          find . -type f -name "*.resp" -print -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
          # Also patch BoringSSL-GRPC podspec if needed
          grep -r " -G" Pods/Target\ Support\ Files/BoringSSL-GRPC/ || echo "No -G found in BoringSSL"
          cd ..
      - name: Flutter config-only (NO BUILD)
        script: |
          flutter build ios --config-only --no-codesign --release --verbose
          ls -lh ios/Flutter/Generated.xcconfig
          cat ios/Flutter/Generated.xcconfig | head -n 20
      - name: Set up keychain + ExportOptions
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>8P9JZZ535V</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.baborensemble.app</key>
              <string>Baborensemble AppStore 2027 FINAL</string>
            </dict>
          </dict>
          </plist>
          PLIST
          cat ios/Runner/ExportOptions.plist
      - name: Build IPA - TURBO V3 ARCHIVE ONLY (no flutter build)
        script: |
          echo "Starting TURBO V3 - ARCHIVE ONLY MODE"
          # Live patch loop - runs during entire xcodebuild
          (while true; do
            find ios/Pods -type f -name "*.xcconfig" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
            find ios -type f -name "*.resp" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -type f -name "*.xcconfig" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -type f -name "*.resp" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null || true
            sleep 0.05
          done) &
          TURBO_PID=$!
          trap "kill $TURBO_PID || true" EXIT
          set -e
          echo "STEP 1 SKIPPED: flutter build ios --no-codesign (this was failing with -G)"
          echo "STEP 2 xcodebuild archive MANUAL - with CLANG_USE_RESPONSE_FILE=NO"
          xcodebuild -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -archivePath build/ios/archive/Runner.xcarchive             -destination "generic/platform=iOS"             CODE_SIGN_STYLE=Manual             DEVELOPMENT_TEAM=8P9JZZ535V             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL"             CLANG_USE_RESPONSE_FILE=NO             COMPILER_INDEX_STORE_ENABLE=NO             clean archive | tee archive.log
          echo "STEP 3 export IPA"
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive             -archivePath build/ios/archive/Runner.xcarchive             -exportPath build/ios/ipa             -exportOptionsPlist ios/Runner/ExportOptions.plist
          kill $TURBO_PID || true
          ls -lh build/ios/ipa/
          du -h build/ios/ipa/*.ipa
          xcrun --show-sdk-version --sdk iphoneos
          echo "SDK VERSION FOR APPSTORE:"
          xcrun --show-sdk-version --sdk iphoneos | grep -E "iPhoneOS|SDK"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - archive.log
