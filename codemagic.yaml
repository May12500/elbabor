workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Génération garantie des icônes iOS"
        script: |
          set -e
          ICONSET="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"

          LOGO="./logo_babor.png"

          # Génération de toutes les tailles obligatoires sans transparence (fond blanc)
          sips -s format png --padColor FFFFFF -z 40 40     "$LOGO" --out "$ICONSET/Icon-App-20x20@2x.png"
          sips -s format png --padColor FFFFFF -z 60 60     "$LOGO" --out "$ICONSET/Icon-App-20x20@3x.png"
          sips -s format png --padColor FFFFFF -z 58 58     "$LOGO" --out "$ICONSET/Icon-App-29x29@2x.png"
          sips -s format png --padColor FFFFFF -z 87 87     "$LOGO" --out "$ICONSET/Icon-App-29x29@3x.png"
          sips -s format png --padColor FFFFFF -z 80 80     "$LOGO" --out "$ICONSET/Icon-App-40x40@2x.png"
          sips -s format png --padColor FFFFFF -z 120 120   "$LOGO" --out "$ICONSET/Icon-App-40x40@3x.png"
          sips -s format png --padColor FFFFFF -z 120 120   "$LOGO" --out "$ICONSET/Icon-App-60x60@2x.png"
          sips -s format png --padColor FFFFFF -z 180 180   "$LOGO" --out "$ICONSET/Icon-App-60x60@3x.png"
          sips -s format png --padColor FFFFFF -z 76 76     "$LOGO" --out "$ICONSET/Icon-App-76x76@1x.png"
          sips -s format png --padColor FFFFFF -z 152 152   "$LOGO" --out "$ICONSET/Icon-App-76x76@2x.png"
          sips -s format png --padColor FFFFFF -z 167 167   "$LOGO" --out "$ICONSET/Icon-App-83.5x83.5@2x.png"
          sips -s format png --padColor FFFFFF -z 1024 1024 "$LOGO" --out "$ICONSET/Icon-App-1024x1024@1x.png"

          cat << 'EOF' > "$ICONSET/Contents.json"
          {
            "images" : [
              { "size" : "20x20", "idiom" : "iphone", "filename" : "Icon-App-20x20@2x.png", "scale" : "2x" },
              { "size" : "20x20", "idiom" : "iphone", "filename" : "Icon-App-20x20@3x.png", "scale" : "3x" },
              { "size" : "29x29", "idiom" : "iphone", "filename" : "Icon-App-29x29@2x.png", "scale" : "2x" },
              { "size" : "29x29", "idiom" : "iphone", "filename" : "Icon-App-29x29@3x.png", "scale" : "3x" },
              { "size" : "40x40", "idiom" : "iphone", "filename" : "Icon-App-40x40@2x.png", "scale" : "2x" },
              { "size" : "40x40", "idiom" : "iphone", "filename" : "Icon-App-40x40@3x.png", "scale" : "3x" },
              { "size" : "60x60", "idiom" : "iphone", "filename" : "Icon-App-60x60@2x.png", "scale" : "2x" },
              { "size" : "60x60", "idiom" : "iphone", "filename" : "Icon-App-60x60@3x.png", "scale" : "3x" },
              { "size" : "76x76", "idiom" : "ipad", "filename" : "Icon-App-76x76@1x.png", "scale" : "1x" },
              { "size" : "76x76", "idiom" : "ipad", "filename" : "Icon-App-76x76@2x.png", "scale" : "2x" },
              { "size" : "83.5x83.5", "idiom" : "ipad", "filename" : "Icon-App-83.5x83.5@2x.png", "scale" : "2x" },
              { "size" : "1024x1024", "idiom" : "ios-marketing", "filename" : "Icon-App-1024x1024@1x.png", "scale" : "1x" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF

          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" ios/Runner/Info.plist

      - name: "2-Préparation et Dépendances"
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          echo "CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES = YES" >> ios/Flutter/Release.xcconfig
          cd ios
          pod install
          sed -i '' 's/-G\b//g' Pods/Pods.xcodeproj/project.pbxproj
          find Pods -name "basic_seq.h" -exec sed -i '' 's/Traits::template CallSeqFactory/Traits::CallSeqFactory/g' {} +

      - name: "3-Build IPA via Flutter"
        script: |
          set -e
          xcode-project use-profiles
          flutter build ipa --release \
            --build-name=1.2.0 \
            --build-number=$(echo $BUILD_NUMBER) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa