workflows:
  ios-151-ultimate-g-fix:
    name: BUILD 151 ULTIMATE G FIX
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
      groups:
        - appstore_api
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: Select Xcode 26.2
        script: |
          xcodebuild -version
      - name: Overwrite Podfile ULTIMATE NO-G
        script: |
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            p = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            raise "#{p} must exist." unless File.exist?(p)
            File.foreach(p) do |line|
              m = line.match(/FLUTTER_ROOT=(.*)/)
              return m[1].strip if m
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['CLANG_USE_RESPONSE_FILE'] = 'NO'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                %w[OTHER_CFLAGS OTHER_CPLUSPLUSFLAGS OTHER_LDFLAGS].each do |key|
                  if config.build_settings[key]
                    config.build_settings[key] = config.build_settings[key].gsub('-G', '').gsub('  ', ' ').strip
                  end
                end
                config.build_settings['COMPILER_FLAGS'] = ''
                if target.name.include?('BoringSSL') || target.name.include?('gRPC') || target.name.include?('abseil')
                  config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
                  config.build_settings['OTHER_CFLAGS'] = '$(inherited) -DOPENSSL_NO_ASM -w'
                  config.build_settings['OTHER_CPLUSPLUSFLAGS'] = '$(inherited) -DOPENSSL_NO_ASM -w'
                end
              end
            end
            # Also clean pbxproj
            pbx = 'Pods/Pods.xcodeproj/project.pbxproj'
            if File.exist?(pbx)
              txt = File.read(pbx)
              txt = txt.gsub(/ -G /, ' ').gsub(/"-G"/, '""').gsub(/ -G;/, ';').gsub(/ -G"/, '"')
              File.write(pbx, txt)
            end
          end
          PODFILE
      - name: Flutter clean and pub get
        script: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get
      - name: Pod install + NUKE -G
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          echo "=== NUKE -G from all Pods files ==="
          find . -type f \( -name "*.xcconfig" -o -name "*.pbxproj" -o -name "*.podspec" \) -exec sed -i '' 's/ -G / /g; s/"-G"/""/g; s/ -G;/;/g; s/ -G$//g; s/-G//g' {} \; || true
          echo "=== CHECK remaining -G ==="
          grep -R " -G " Pods/ --include="*.xcconfig" --include="*.pbxproj" | head -20 || echo "No -G found - GOOD"
          cd ..
      - name: Create CLANG WRAPPER that strips -G
        script: |
          mkdir -p ~/bin
          REAL_CLANG="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          cat > ~/bin/clang << WRAPPER
          #!/bin/bash
          ARGS=()
          for arg in "\$@"; do
            if [ "\$arg" = "-G" ]; then
              continue
            fi
            # also strip -G8, -G0 etc if any
            if [[ "\$arg" == -G* ]]; then
              # keep only if it's -G followed by something that is not just G? For BoringSSL bug it's exactly -G
              if [ "\$arg" = "-G" ]; then continue; fi
            fi
            ARGS+=("\$arg")
          done
          exec "$REAL_CLANG" "\${ARGS[@]}"
          WRAPPER
          chmod +x ~/bin/clang
          REAL_CLANGPP="/Applications/Xcode-26.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
          cat > ~/bin/clang++ << WRAPPER
          #!/bin/bash
          ARGS=()
          for arg in "\$@"; do
            if [ "\$arg" = "-G" ]; then continue; fi
            ARGS+=("\$arg")
          done
          exec "$REAL_CLANGPP" "\${ARGS[@]}"
          WRAPPER
          chmod +x ~/bin/clang++
          echo "=== clang wrapper created ==="
          cat ~/bin/clang
          ls -lh ~/bin/clang*
      - name: Flutter config-only
        script: |
          flutter build ios --config-only --no-codesign --release
      - name: PATCH pbxproj FORCE PROFILE
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' ios/Runner.xcodeproj/project.pbxproj || true
          python3 - << 'PY'
          import re
          path = "ios/Runner.xcodeproj/project.pbxproj"
          txt = open(path).read()
          txt = re.sub(r'DEVELOPMENT_TEAM = [^;]+;', 'DEVELOPMENT_TEAM = 8P9JZZ535V;', txt)
          txt = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', '', txt)
          txt = txt.replace('CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Manual; PROVISIONING_PROFILE_SPECIFIER = "Baborensemble AppStore 2027 FINAL";')
          open(path,'w').write(txt)
          PY
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>8P9JZZ535V</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.baborensemble.app</key>
              <string>Baborensemble AppStore 2027 FINAL</string>
            </dict>
          </dict>
          </plist>
          PLIST
      - name: Setup signing DIAGNOSTIC + MANUAL INSTALL
        script: |
          set -e
          ls -lh | grep -E "p12|mobileprovision|codemagic|pubspec" || true
          keychain initialize
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p /tmp/certs
          keychain add-certificates || true
          security find-identity -v -p codesigning || true
          for P12 in ./babor_new_2027.p12 ./elbabor_dist_2027.p12 ./Babor*.p12 ./ios/*.p12 ./*.p12; do
            if [ -f "$P12" ]; then
              echo "FOUND P12: $P12"
              security import "$P12" -k ~/Library/Keychains/build.keychain -P babor2027 -T /usr/bin/codesign -T /usr/bin/security || true
              security import "$P12" -k ~/Library/Keychains/login.keychain -P babor2027 -T /usr/bin/codesign -T /usr/bin/security || true
            fi
          done
          security find-identity -v -p codesigning || true
          app-store-connect fetch-signing-files "com.baborensemble.app" --type IOS_APP_STORE --platform IOS --certificates-dir /tmp/certs --profiles-dir ~/Library/MobileDevice/Provisioning\ Profiles || true
          xcode-project use-profiles || true
          find . -maxdepth 4 -name "*.mobileprovision" -exec cp {} ~/Library/MobileDevice/Provisioning\ Profiles/ \; 2>/dev/null || true
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
      - name: Build IPA ULTIMATE WRAPPER
        script: |
          export PATH="$HOME/bin:$PATH"
          echo "PATH=$PATH"
          which clang
          clang --version || true
          (while true; do
            find ios/Pods -type f -name "*.xcconfig" -exec sed -i '' 's/ -G / /g; s/-G//g' {} \; 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -type f \( -name "*.xcconfig" -o -name "*.resp" -o -name "common-args.resp" \) -exec sed -i '' 's/ -G / /g; s/-G//g' {} \; 2>/dev/null || true
            sleep 0.02
          done) &
          TURBO_PID=$!
          trap "kill $TURBO_PID || true" EXIT
          set -e
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/archive/Runner.xcarchive -destination "generic/platform=iOS" CLANG_USE_RESPONSE_FILE=NO OTHER_CFLAGS="" OTHER_CPLUSPLUSFLAGS="" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM=8P9JZZ535V PROVISIONING_PROFILE_SPECIFIER="Baborensemble AppStore 2027 FINAL" clean archive | tee archive.log
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/Runner/ExportOptions.plist | tee export.log
          kill $TURBO_PID || true
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - archive.log
      - export.log
