workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Initialize Code Signing"
        script: |
          set -e
          keychain initialize
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: "2-Flutter Dependencies & Pods"
        script: |
          set -e
          flutter pub get
          cd ios
          pod install

      - name: "3-Build IPA & Purge -G Flag"
        script: |
          set -e
          
          # Suppression chirurgicale et définitive de l'option -G dans tous les fichiers de configuration générés
          python3 -c '
          import os, re
          for root, dirs, files in os.walk("ios"):
              for file in files:
                  if file.endswith((".xcconfig", ".pbxproj", ".h", ".m", ".cc", ".cpp")):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                          new_content = re.sub(r"(?<![\w-])\-G(?![\w-])", "", content)
                          if content != new_content:
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(new_content)
                      except Exception:
                          pass
          '

          flutter build ipa --release --no-codesign

          PROFILE_NAME="Baborensemble AppStore 2027 FINAL"

          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     archive \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     DEVELOPMENT_TEAM=8P9JZZ535V \
                     PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          cat << EOF > /tmp/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>8P9JZZ535V</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath build/ios/archive/Runner.xcarchive \
                     -exportPath build/ios/ipa \
                     -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa