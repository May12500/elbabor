workflows:
  ios-baborensemble-intel:
    name: Baborensemble iOS 18.4 SDK - 149MB - Transporter FINAL BG
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4
      flutter: 3.32.0
      cocoapods: 1.16.2
    scripts:
      - name: Xcode Version
        script: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Flutter clean + Podfile FINAL
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter precache --ios
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['CLANG_ENABLE_EXPLICIT_MODULES'] = 'NO'
              end
            end
          end
          PODFILE
          flutter build ios --config-only --no-codesign --release || true
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          find ios -name "project.pbxproj" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          cd ios
          rm -rf Pods Podfile.lock
          pod deintegrate || true
          rm -rf Pods
          pod install --repo-update
          find . -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          find . -name "project.pbxproj" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          cd ..

      - name: Build IPA - Flutter - BG remover - FINAL
        script: |
          set -e
          set -o pipefail
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          find ios -name "project.pbxproj" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \;
          echo "Starting background -G remover..."
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; 2>/dev/null; find /tmp -name "*.resp" -type f -exec sed -i '' 's/ -G//g; s/-G//g' {} \; 2>/dev/null; sleep 0.05; done) &
          BG_PID=$!
          sleep 1
          flutter build ipa --release --no-codesign --export-method app-store 2>&1 | tee build.log
          kill $BG_PID || true
          ls -lh build/ios/archive/Runner.xcarchive || true
          ls -lh build/ios/ipa/*.ipa || true
          du -sh build/ios/archive/Runner.xcarchive || true

    artifacts:
      - build/ios/archive/Runner.xcarchive
      - build/ios/ipa/*.ipa
      - build.log
