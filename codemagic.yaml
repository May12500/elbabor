workflows:
  ios-26-final:
    name: iOS 26 SDK - BUILD 106 FINAL
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_api
      flutter: 3.38.1
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files with UZSWN5MYXB
        script: |
          app-store-connect fetch-signing-files com.baborensemble.app --type IOS_APP_STORE --create --issuer-id $APP_STORE_CONNECT_ISSUER_ID --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY
      - name: Set up provisioning
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Clean + Pods
        script: |
          rm -f *.png
          flutter clean
          flutter pub get
          cd ios && rm -rf Pods Podfile.lock && pod install --repo-update && cd ..
      - name: Build IPA iOS 26 + turbo -G remover
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; find $CM_BUILD_DIR -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; sleep 0.2; done) &
          BG_PID=$!
          flutter build ipa --release --export-method app-store --no-tree-shake-icons
          kill $BG_PID || true
          xcrun --sdk iphoneos --show-sdk-version
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa