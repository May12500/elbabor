workflows:
  ios-26-sdk-build-114-reussi:
    name: iOS 26 SDK - BUILD 114 REUSSI
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.38.1
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Use profiles from Codemagic
        script: |
          xcode-project use-profiles || true
      - name: Clean + Pods + TURBO remove -G
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; sleep 0.2; done) &
          TURBO_PID=$!
          flutter clean
          flutter pub get
          cd ios && pod install --repo-update
          cd ..
          kill $TURBO_PID || true
      - name: Build IPA with iOS 26 SDK + TURBO
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; find . -name "common-args.resp" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null; sleep 0.2; done) &
          TURBO_PID=$!
          flutter build ipa --release || true
          flutter build ios --release --no-codesign || true
          kill $TURBO_PID || true
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

  ios-26-sdk-build-118-final-ipa:
    name: iOS 26 SDK - BUILD 118 FINAL IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.38.1
      xcode: 26.2
      cocoapods: default
      groups:
        - appstore_api
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.baborensemble.app --type IOS_APP_STORE --create --verbose
          echo "=== Certificates after fetch ==="
          app-store-connect certificates list || true
          echo "=== Profiles after fetch ==="
          app-store-connect profiles list --bundle-id-identifier com.baborensemble.app || true
      - name: Add certificates
        script: |
          keychain add-certificates
      - name: Use profiles
        script: |
          xcode-project use-profiles
      - name: Create ExportOptions.plist
        script: |
          cat > ios/Runner/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>8P9JZZ535V</string>
          </dict>
          </plist>
          PLIST
      - name: Clean + Pods + TURBO remove -G
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; sleep 0.2; done) &
          TURBO_PID=$!
          flutter clean
          flutter pub get
          cd ios && pod install --repo-update
          cd ..
          kill $TURBO_PID || true
      - name: Build IPA with iOS 26 SDK + TURBO
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; find . -name "common-args.resp" -exec sed -i '' 's/ -G / /g; s/ -G$//g' {} \; 2>/dev/null; sleep 0.2; done) &
          TURBO_PID=$!
          flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist
          kill $TURBO_PID || true
    artifacts:
      - build/ios/ipa/*.ipa
