workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Flutter Dependencies & Pods"
        script: |
          set -e
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods
          pod cache clean --all || true
          
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install --repo-update

      - name: "2-Build IPA AppStore"
        script: |
          set -e
          xcode-project use-profiles
          
          # SOLUTION RADICALE : Injection d'un fichier xcconfig global personnel 
          # qui force Xcode à ignorer ou supprimer les drapeaux CFLAGS non supportés.
          echo "OTHER_CFLAGS = \$(inherited) -Wno-error=unsupported-option -Wno-unknown-warning-option" >> ios/Flutter/Release.xcconfig
          echo "OTHER_CPLUSPLUSFLAGS = \$(inherited) -Wno-error=unsupported-option -Wno-unknown-warning-option" >> ios/Flutter/Release.xcconfig
          
          flutter build ipa --release --no-pub --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa