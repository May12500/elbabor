workflows:
  ios-26-final:
    name: iOS 26 SDK - BUILD 107 NO FETCH
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.1
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Clean + Pods
        script: |
          rm -f *.png
          flutter clean
          flutter pub get
          cd ios && rm -rf Pods Podfile.lock && pod install --repo-update && cd ..
      - name: Build IPA iOS 26 + turbo -G remover
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; find $CM_BUILD_DIR -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; sleep 0.2; done) &
          BG_PID=$!
          flutter build ipa --release --export-method app-store --no-tree-shake-icons
          kill $BG_PID || true
          xcrun --sdk iphoneos --show-sdk-version
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa