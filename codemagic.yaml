workflows:
  ios-baborensemble-intel:
    name: Baborensemble iOS 26.2 SDK - Mac Intel - 149MB - Transporter
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.2
      flutter: 3.38.1
      cocoapods: 1.17.0
    scripts:
      - name: Xcode 26.2 - iOS 26.2 SDK - Version Check
        script: |
          set -e
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Flutter clean + pub get + Podfile No Force + config-only
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter precache --ios
          cat > ios/Podfile << 'PODFILE'
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['OTHER_LDFLAGS'] = config.build_settings['OTHER_LDFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_LDFLAGS']
                config.build_settings['OTHER_CFLAGS'] = config.build_settings['OTHER_CFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_CFLAGS']
                config.build_settings['OTHER_CPLUSPLUSFLAGS'] = config.build_settings['OTHER_CPLUSPLUSFLAGS'].to_s.gsub('-G', '') if config.build_settings['OTHER_CPLUSPLUSFLAGS']
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['CLANG_ENABLE_MODULES'] = 'NO'
                if target.name == 'BoringSSL-GRPC'
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++11'
                  config.build_settings['CLANG_C_LANGUAGE_STANDARD'] = 'gnu11'
                  config.build_settings['GCC_C_LANGUAGE_STANDARD'] = 'gnu11'
                  config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                  config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
                  config.build_settings['CLANG_WARN_EVERYTHING'] = 'NO'
                  config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS'] = 'NO'
                  config.build_settings['WARNING_CFLAGS'] = '-w'
                  config.build_settings['OTHER_CFLAGS'] = '-w -Wno-everything -Wno-error -fpermissive -w -DNDEBUG -DOPENSSL_NO_ASM -DBORINGSSL_PREFIX=GRPC -DBORINGSSL_ANDROID_SYSTEM'
                  config.build_settings['OTHER_CPLUSPLUSFLAGS'] = '-w -std=c++11 -Wno-everything -Wno-error -fpermissive -w -DNDEBUG -DOPENSSL_NO_ASM -DBORINGSSL_PREFIX=GRPC -DBORINGSSL_ANDROID_SYSTEM'
                else
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                  config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'
                end
              end
            end
          end
          PODFILE
          flutter build ios --config-only --no-codesign --release
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \; || true
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/-G//g' {} \; || true

      - name: Pod install - Patch tls_record.cc
        script: |
          set -e
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod deintegrate || true
          rm -rf Pods
          pod install --repo-update
          echo "=== PATCH tls_record.cc ==="
          TLS="Pods/BoringSSL-GRPC/src/ssl/tls_record.cc"
          if [ -f "$TLS" ]; then
            cp "$TLS" "$TLS.bak"
            printf '#pragma clang diagnostic push
#pragma clang diagnostic ignored "-Weverything"
#pragma clang diagnostic ignored "-Werror"
' | cat - "$TLS" > /tmp/tls.cc && mv /tmp/tls.cc "$TLS"
            echo '#pragma clang diagnostic pop' >> "$TLS"
            echo "Patched $TLS"
          fi
          cd ..

      - name: Remove -G from ALL xcconfigs
        script: |
          set -e
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \; || true
          find ios -name "*.xcconfig" -type f -exec sed -i '' 's/-G//g' {} \; || true
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/ -G//g' {} \; || true
          find ios/Pods -name "*.xcconfig" -type f -exec sed -i '' 's/-G//g' {} \; || true
          grep -R " -G" ios/ || echo "No -G in ios/ - OK VERT"

      - name: Build xcarchive - iOS 26.2 SDK - FINAL VERT
        script: |
          set -e
          set -o pipefail
          mkdir -p build/ios/archive
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release -archivePath build/ios/archive/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" GCC_WARN_INHIBIT_ALL_WARNINGS=YES CLANG_WARN_EVERYTHING=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO OTHER_CFLAGS="-w" OTHER_CPLUSPLUSFLAGS="-w -std=c++11 -Wno-everything -fpermissive" 2>&1 | tee build.log
          ls -lh build/ios/archive/Runner.xcarchive
          du -sh build/ios/archive/Runner.xcarchive

      - name: Create IPA folder for Transporter - FIX No such file
        script: |
          set -e
          echo "=== FIX Create IPA folder - Find Runner.xcarchive ==="
          find build -name "*.xcarchive" -type d
          ls -lh build/ios/archive/ || true
          ls -lh build/ || true
          ARCHIVE_PATH="build/ios/archive/Runner.xcarchive"
          if [ ! -d "$ARCHIVE_PATH" ]; then
            FOUND=$(find build -name "*.xcarchive" -type d | head -1)
            if [ -n "$FOUND" ]; then
              echo "Found archive at $FOUND, copying to $ARCHIVE_PATH"
              mkdir -p build/ios/archive
              cp -R "$FOUND" "$ARCHIVE_PATH"
            else
              echo "No xcarchive found, listing all:"
              find . -name "*.xcarchive" -type d 2>/dev/null | head -20
              echo "Creating dummy IPA folder for Transporter from build log"
              mkdir -p build/ios/archive
            fi
          fi
          ls -lh build/ios/archive/Runner.xcarchive
          du -sh build/ios/archive/Runner.xcarchive
          echo "=== ARCHIVE READY - iOS 26.2 SDK - 149MB - FIX 90725 ==="
          xcrun --show-sdk-version --sdk iphoneos

    artifacts:
      - build/ios/archive/Runner.xcarchive
      - build.log
