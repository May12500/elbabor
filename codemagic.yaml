workflows:
  babor-167-minimal:
    name: "babor-167-minimal"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baborensemble.app
      xcode: 26.2
      flutter: stable
      cocoapods: 1.17.0
      vars:
        BUNDLE_ID: "com.baborensemble.app"
    scripts:
      - name: "1-Préparation et Dépendances"
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          
          # Autorise les headers non-modulaires pour éviter les erreurs Firebase
          echo "CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES = YES" >> ios/Flutter/Release.xcconfig
          
          cd ios
          pod install
          
          # Purge le paramètre -G incompatible avec Xcode 26
          sed -i '' 's/-G\b//g' Pods/Pods.xcodeproj/project.pbxproj
          
          # Patch du template gRPC pour Xcode 26
          find Pods -name "basic_seq.h" -exec sed -i '' 's/Traits::template CallSeqFactory/Traits::CallSeqFactory/g' {} +

      - name: "2-Build IPA via Flutter"
        script: |
          set -e
          xcode-project use-profiles
          
          # Build en version 1.2.0 pour dépasser l'ancienne version bloquante
          flutter build ipa --release \
            --build-name=1.2.0 \
            --build-number=$(echo $BUILD_NUMBER) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa