workflows:
  ios-26-sdk-build-118-final-ipa:
    name: iOS 26 SDK - BUILD 118 FINAL IPA - 61MB
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.38.1
      xcode: 26.2
      cocoapods: default
      groups:
        - appstore_api
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Add certificates
        script: |
          keychain add-certificates
          security find-identity -v -p codesigning || true
      - name: Use profiles
        script: |
          xcode-project use-profiles
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
      - name: Clean + Pods + TURBO remove -G
        script: |
          (while true; do find ~/Library/Developer/Xcode/DerivedData -name "*.resp" -exec sed -i '' 's/ -G//g' {} \; 2>/dev/null; sleep 0.2; done) &
          TURBO_PID=$!
          flutter clean
          flutter pub get
          cd ios && pod install --repo-update
          cd ..
          kill $TURBO_PID || true
      - name: Build IPA - 61MB - local archive App Store
        script: |
          flutter build ipa --release --export-method app-store -v
          ls -lh build/ios/ipa/ || true
    artifacts:
      - build/ios/ipa/*.ipa